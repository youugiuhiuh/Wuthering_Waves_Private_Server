# SourceHut builds.sr.ht：与 GitHub Actions public-release 等效
# 1) 在 builds.sr.ht Secrets 中创建两个 secret，记下 UUID，填入下方 secrets 列表（或提交时通过 hut -e 传入环境变量）
# 2) 将 sources 中的 ~youruser/your-repo 改为本仓库的 git.sr.ht 路径；若从 git.sr.ht 触发则 sources 可被自动注入
# 3) 手动发布时在提交 build 时设置 environment VERSION=0.4.4

image: ubuntu/22.04
packages:
  - curl
  - git
  - ca-certificates
  - upx-ucl
  - jq
  - build-essential
sources:
  - https://git.sr.ht/~youruser/your-repo
# 将下方改为你在 builds.sr.ht 创建的 secret UUID，或提交时用 -e SOURCE_REPO_TOKEN=... -e PUBLIC_REPO_TOKEN=... 传入
# secrets:
#   - your-source-repo-token-uuid
#   - your-public-repo-token-uuid
environment:
  PUBLIC_OWNER: youugiuhiuh
  PUBLIC_REPO: Wuthering_Waves_Private_Server
tasks:
  - resolve-and-sync: |
      set +x
      export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
      if [ -n "$VERSION" ]; then
        NEW_VERSION="${VERSION#v}"
      else
        NEW_VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/' | sed 's/^v//')
      fi
      echo "NEW_VERSION=$NEW_VERSION" >> ~/.buildenv
      if [ -n "$VERSION" ]; then
        sed -i 's/^version = .*/version = "'"$NEW_VERSION"'"/' rust/tgbot/Cargo.toml
        git config user.email "ci@sr.ht"
        git config user.name "builds.sr.ht"
        git add rust/tgbot/Cargo.toml
        git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || true
        git push "https://${SOURCE_REPO_TOKEN}@git.sr.ht/~youruser/your-repo" HEAD:main || true
      fi
      git tag -f "v${NEW_VERSION}"
      git push "https://${SOURCE_REPO_TOKEN}@git.sr.ht/~youruser/your-repo" "v${NEW_VERSION}" --force || true
      set -x
  - install-rust: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      . "$HOME/.cargo/env"
      rustc --version
  - install-go: |
      curl -sL "https://go.dev/dl/go1.22.4.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
      export PATH="/usr/local/go/bin:$PATH"
      go version
      go install mvdan.cc/garble@latest
      export PATH="$PATH:$(go env GOPATH)/bin"
  - build-tgbot: |
      . "$HOME/.cargo/env"
      . ~/.buildenv
      cd rust/tgbot
      RUSTFLAGS="--remap-path-prefix $(pwd)=/project" cargo build --release --locked
      upx --best --lzma target/release/tgbot || true
  - build-installer: |
      . ~/.buildenv
      export PATH="/usr/local/go/bin:$(go env GOPATH)/bin:$PATH"
      cd go/installer
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .
  - prepare-dist: |
      . ~/.buildenv
      mkdir -p dist
      cp rust/tgbot/target/release/tgbot go/installer/installer dist/
      cp README.public.md dist/README.md
  - push-and-release: |
      set +x
      . ~/.buildenv
      # 公开仓以 GitHub 为例；若为 GitLab/Codeberg 可改 API 与 clone URL
      git clone --depth 0 "https://${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" public-repo
      set -x
      cd public-repo
      git config user.email "ci@sr.ht"
      git config user.name "builds.sr.ht"
      rm -rf *
      cp -r ../dist/* .
      git add .
      git commit -m "Publish v${NEW_VERSION}" || true
      git tag -f "v${NEW_VERSION}"
      git push "https://${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" HEAD:main --force
      git push "https://${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" "v${NEW_VERSION}" --force
      AUTH="Authorization: token ${PUBLIC_REPO_TOKEN}"
      API="https://api.github.com/repos/${PUBLIC_OWNER}/${PUBLIC_REPO}"
      for tag in $(curl -sS -H "$AUTH" "${API}/releases?per_page=100" | jq -r '.[].tag_name // empty'); do
        curl -sS -X DELETE -H "$AUTH" "${API}/releases/tags/${tag}" || true
      done
      for tag in $(curl -sS -H "$AUTH" "${API}/tags?per_page=100" | jq -r '.[].name // empty'); do
        curl -sS -X DELETE -H "$AUTH" "${API}/git/refs/tags/${tag}" || true
      done
      BODY="Public distribution package v${NEW_VERSION}."
      JSON=$(jq -n --arg tag "v${NEW_VERSION}" --arg name "v${NEW_VERSION}" --arg body "$BODY" '{tag_name:$tag,name:$name,body:$body}')
      RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases")
      RID=$(echo "$RES" | jq -r '.id // empty')
      for f in dist/tgbot dist/installer; do
        [ -f "$f" ] && curl -sS -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@$f" "${API}/releases/${RID}/assets?name=$(basename $f)"
      done
artifacts:
  - dist/tgbot
  - dist/installer
