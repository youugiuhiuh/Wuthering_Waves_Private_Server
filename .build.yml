# SourceHut builds.sr.ht：构建并在源仓库创建Release
# 1) 在 builds.sr.ht Secrets 中创建 secret，记下 UUID，填入下方 secrets 列表（或提交时通过 hut -e 传入）
# 2) 将 sources 中的 ~youruser/your-repo 改为本仓库的 git.sr.ht 路径
# 3) 手动发布时在提交 build 时设置 environment VERSION=0.4.4
# 4) SOURCE_REPO_TOKEN 需要是 GitHub token，用于推送 tag 和创建 Release

image: ubuntu/22.04
packages:
  - curl
  - git
  - ca-certificates
  - upx-ucl
  - jq
  - build-essential
  - minisign
sources:
  - https://git.sr.ht/~youruser/your-repo
# secrets:
#   - your-source-repo-token-uuid
environment:
  SOURCE_OWNER: NicholasDewar
  SOURCE_REPO: Wuthering_Waves_Private_Server
tasks:
  - resolve-and-sync: |
      set +x
      export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
      if [ -n "$VERSION" ]; then
        NEW_VERSION="${VERSION#v}"
      else
        NEW_VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/' | sed 's/^v//')
      fi
      echo "NEW_VERSION=$NEW_VERSION" >> ~/.buildenv
      if [ -n "$VERSION" ]; then
        sed -i 's/^version = .*/version = "'"$NEW_VERSION"'"/' rust/tgbot/Cargo.toml
        git config user.email "ci@sr.ht"
        git config user.name "builds.sr.ht"
        git add rust/tgbot/Cargo.toml
        git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || true
        git push "https://${SOURCE_REPO_TOKEN}@git.sr.ht/~youruser/your-repo" HEAD:main || true
      fi
      git tag -f "v${NEW_VERSION}"
      git push "https://${SOURCE_REPO_TOKEN}@git.sr.ht/~youruser/your-repo" "v${NEW_VERSION}" --force || true
      set -x
  - install-rust: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      . "$HOME/.cargo/env"
      rustc --version
  - install-go: |
      curl -sL "https://go.dev/dl/go1.26.2.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
      export PATH="/usr/local/go/bin:$PATH"
      go version
      go install mvdan.cc/garble@latest
      export PATH="$PATH:$(go env GOPATH)/bin"
  - build-tgbot: |
      . "$HOME/.cargo/env"
      . ~/.buildenv
      cd rust/tgbot
      RUSTFLAGS="--remap-path-prefix $(pwd)=/project" cargo build --release --locked
      upx --best --lzma target/release/tgbot || true
  - build-installer: |
      . ~/.buildenv
      export PATH="/usr/local/go/bin:$(go env GOPATH)/bin:$PATH"
      cd go/installer
      CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .
  - build-sub-server: |
      . ~/.buildenv
      export PATH="/usr/local/go/bin:$(go env GOPATH)/bin:$PATH"
      cd tools/sub-server
      go mod download
      CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build \
        -ldflags="-s -w -X main.version=${NEW_VERSION}" \
        -o sub-server .
      if command -v minisign &>/dev/null && [ -n "${MINISIGN_SECRET_KEY}" ]; then
        echo "${MINISIGN_SECRET_KEY}" > /tmp/minisign.key
        minisign -S -s /tmp/minisign.key -m sub-server \
          -t "${NEW_VERSION}:sub-server" -x sub-server.minisig
        rm -f /tmp/minisign.key
      fi
  - prepare-dist: |
      . ~/.buildenv
      mkdir -p dist
      cp rust/tgbot/target/release/tgbot go/installer/installer dist/
      if [ -f tools/sub-server/sub-server ]; then
        cp tools/sub-server/sub-server dist/
        cp tools/sub-server/sub-server.minisig dist/ 2>/dev/null || true
      fi
  - create-release: |
      set +x
      . ~/.buildenv
      AUTH="Authorization: token ${SOURCE_REPO_TOKEN}"
      API="https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}"
      for tag in $(curl -sS -H "$AUTH" "${API}/releases?per_page=100" | jq -r '.[].tag_name // empty'); do
        echo "Deleting release: $tag"
        curl -sS -X DELETE -H "$AUTH" "${API}/releases/tags/${tag}" || true
      done
      for tag in $(curl -sS -H "$AUTH" "${API}/tags?per_page=100" | jq -r '.[].name // empty'); do
        curl -sS -X DELETE -H "$AUTH" "${API}/git/refs/tags/${tag}" || true
      done
      BODY="Release v${NEW_VERSION}."
      JSON=$(jq -n --arg tag "v${NEW_VERSION}" --arg name "v${NEW_VERSION}" --arg body "$BODY" '{tag_name:$tag,name:$name,body:$body}')
      RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases")
      RID=$(echo "$RES" | jq -r '.id // empty')
      for f in dist/tgbot dist/installer dist/sub-server; do
        [ -f "$f" ] && curl -sS -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@$f" "${API}/releases/${RID}/assets?name=$(basename $f)"
      done
      set -x
artifacts:
  - dist/tgbot
  - dist/installer
  - dist/sub-server