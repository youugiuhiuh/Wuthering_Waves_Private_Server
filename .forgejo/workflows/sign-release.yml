# Forgejo 版 Minisign Sign Release（由 .github/workflows/sign-release.yml 派生）。
# 与 GitHub 版的差异（均为平台语法，逻辑保持同步 —— 两文件需一起改）：
#   1. permissions: 移除 —— Forgejo 忽略该键，且自动 token 已有写权限
#   2. name 加 (Forgejo) 后缀 —— 便于在 UI 区分
#   3. install 不用 sudo —— Forgejo steps 以 root 运行（GitHub 托管 runner
#      以非 root 用户运行，写 /usr/local/bin 需要 sudo）
#
# 注意 environment: production 在 Forgejo 上会被忽略；
# MINISIGN_SECRET_KEY 的门禁需由 Forgejo 侧的 secret 权限控制承担。
#
# ⚠️ 维护约定：逻辑变更需同步改两个文件。
#    本文件与 public-release.yml 共用同一套 provider 推导逻辑。
#
# 本工作流只使用跨平台原语：
#   - 零 @uses，全部原生 git/curl
#   - 发布走 provider 抽象（与 public-release.yml 同一套）：
#       RELEASE_PROVIDER=github   → api.github.com   （默认，当前行为不变）
#       RELEASE_PROVIDER=forgejo  → <server>/api/v1
#   - Token 自动适配：GITHUB_TOKEN / FORGEJO_TOKEN / GITEA_TOKEN 谁注入用谁
#
# GitHub 上 environment: production 提供 secret 门禁；Forgejo 忽略该键，
# 密钥门禁需由 Forgejo 侧的 secret 权限控制承担。

name: Minisign Sign Release (Forgejo)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to sign (e.g., v3.1.9)"
        required: true
        type: string

# Forgejo 忽略 permissions:（官方差异清单所列）。此处整块移除：
# Forgejo 自动注入的 FORGEJO_TOKEN / GITHUB_TOKEN（互为镜像）默认已有仓库写权限，
# 足以调用 release API 上传签名资产。无需 enable-openid-connect（那用于跨实例授权）。

jobs:
  sign:
    name: Sign Release Assets with Minisign
    environment: production
    runs-on: ubuntu-latest
    steps:
      # minisign 取自上游 GitHub Releases（外部下载，非平台 API，两平台均可访问）。
      # 可通过 repo 变量 MINISIGN_URL 覆盖为镜像地址。
      - name: Install Minisign
        env:
          MINISIGN_URL: ${{ vars.MINISIGN_URL }}
        run: |
          URL="${MINISIGN_URL:-https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz}"

          # runner 可能是 amd64 或 arm64（二者共用 ubuntu-latest 标签），
          # 不能写死 x86_64。minisign 0.12 tarball 实测含两架构目录。
          case "$(uname -m)" in
            x86_64)  MS_ARCH=x86_64 ;;
            aarch64) MS_ARCH=aarch64 ;;
            *) echo "::error::不支持的架构: $(uname -m)"; exit 1 ;;
          esac

          curl -fsSL "$URL" | tar xz
          # Forgejo 官方：steps 以 root 运行，无需 sudo（root 镜像常无 sudo）。
          install "minisign-linux/$MS_ARCH/minisign" /usr/local/bin/minisign
          minisign -v

      - name: Prepare Secret Key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # 空值守卫：空 secret 会写成空文件并静默继续，直到签名步骤报模糊错误。
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY 未配置" >&2
            exit 1
          fi
          # 随机目录 + 700，降低固定路径的残留暴露面。
          KEY_DIR="$(mktemp -d)"
          chmod 700 "$KEY_DIR"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY_DIR/minisign.key"
          chmod 600 "$KEY_DIR/minisign.key"
          echo "MINISIGN_KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"
          echo "MINISIGN_KEY_PATH=$KEY_DIR/minisign.key" >> "$GITHUB_ENV"
          echo "secret key written to $KEY_DIR/minisign.key（内容不打印）"

      # 用原生 git 代替 actions/checkout（本 workflow 实际不依赖仓库内容，
      # 仅为与其它工作流保持一致的最小检出）。
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git"
          git config --local http.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch -q --prune --no-tags origin "$GITHUB_SHA"
          git checkout -q --force "$GITHUB_SHA"
          git config --local http.extraheader ""

      # ---- 发布抽象：与 public-release.yml 同一套 provider 推导 ----
      - name: Resolve Release Provider
        env:
          RAW_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}
        run: |
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          case "$SERVER" in
            *github.com*) PROVIDER=github ;;
            *)            PROVIDER=forgejo ;;
          esac

          case "$PROVIDER" in
            github)  API_BASE="https://api.github.com" ;;
            forgejo) API_BASE="${SERVER}/api/v1" ;;
            *) echo "::error::未知 RELEASE_PROVIDER: $PROVIDER"; exit 1 ;;
          esac

          echo "RELEASE_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
          echo "RELEASE_API_BASE=$API_BASE" >> "$GITHUB_ENV"
          echo "RELEASE_AUTH_TOKEN=$RAW_TOKEN" >> "$GITHUB_ENV"
          echo "release provider: $PROVIDER ($API_BASE)"

      # 列 assets → 逐个下载 → minisign 签 → 回传 .minisig。
      # 下载用 browser_download_url（两平台均返回绝对地址）；
      # 上传用 /releases/{id}/assets?name= ，两平台路径同构。
      - name: Sign and Upload Release Assets
        run: |
          OWNER_REPO="$GITHUB_REPOSITORY"
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"

          REL=$(curl -fsS \
            -H "Authorization: token $RELEASE_AUTH_TOKEN" \
            "$RELEASE_API_BASE/repos/$OWNER_REPO/releases/tags/$TAG")

          RID=$(echo "$REL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          # 资产上传端点【因 release 而异】，必须用响应里的 upload_url。
          # GitHub 指向 uploads.github.com，写死 api.github.com 会 404
          # （实测 run 34752290176 就挂在这里）。
          # 格式为 .../assets{?name,label}，需剥掉模板尾巴。
          # Forgejo 无独立上传主机也不回该字段，回退为 API 同主机路径。
          UPLOAD_URL=$(echo "$REL" | python3 -c '
          import json,sys
          u=json.load(sys.stdin).get("upload_url") or ""
          print(u.split("{")[0] if u else "")
          ')
          if [ -z "$UPLOAD_URL" ]; then
            UPLOAD_URL="$RELEASE_API_BASE/repos/$OWNER_REPO/releases/$RID/assets"
          fi
          echo "upload url: $UPLOAD_URL"

          ASSETS=$(echo "$REL" | python3 -c '
          import json,sys
          for a in json.load(sys.stdin).get("assets", []):
              print(a["name"] + "\t" + a.get("browser_download_url", ""))
          ')

          if [ -z "$ASSETS" ]; then
            echo "No assets found for release $TAG"
            exit 0
          fi

          echo "Signing release $TAG (id=$RID)..."
          printf '%s\n' "$ASSETS" | while IFS="$(printf '\t')" read -r asset url; do
            [ -n "$asset" ] || continue
            case "$asset" in
              *.minisig) echo "Skipping $asset (already a signature)"; continue ;;
            esac

            echo "::group::Signing $asset"
            curl -fsSL -H "Authorization: token $RELEASE_AUTH_TOKEN" -o "$asset" "$url"
            minisign -S -s "$MINISIGN_KEY_PATH" -m "$asset" -t "${TAG}:${asset}" -W
            # 用 release 响应里的 upload_url（含正确主机），不用 RELEASE_API_BASE。
            curl -fsS -X POST \
              -H "Authorization: token $RELEASE_AUTH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}.minisig" \
              "$UPLOAD_URL?name=${asset}.minisig"
            echo "::endgroup::"
          done

          # 显式清理私钥（trap 不可跨 step）
          [ -n "${MINISIGN_KEY_DIR:-}" ] && rm -rf "$MINISIGN_KEY_DIR" || true

          echo "✅ Signing complete for $TAG"
