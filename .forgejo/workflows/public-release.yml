# Forgejo 版（由 .github/workflows/public-release.yml 派生）。
# 与 GitHub 版的差异仅两处：permissions: → enable-openid-connect，
# 以及移除 step 级 continue-on-error（该键在 Forgejo 被忽略）。
# Forgejo 目录优先级：存在 .forgejo/workflows 时不再读取 .github/workflows。
#
# 工作流刻意只使用跨平台原语：
#   - @uses 仅剩 actions/cache + upload/download-artifact；
#     step 级 continue-on-error 在 Forgejo 被忽略（官方差异清单），故未使用，
#     publish 阶段的 artifact 缺失由「Ensure Dist Artifacts Present」就地重建兜底
#   - 工具链全部来自 mise.toml，用 curl mise.run 引导，GitHub/Forgejo 一致
#   - 发布走 provider 抽象（见文件末尾 Publish Release 步骤注释）：
#       RELEASE_PROVIDER=github   → api.github.com   （默认，当前行为不变）
#       RELEASE_PROVIDER=forgejo  → api/v1（Forgejo/Gitea，自建或 Codeberg）
#     provider 由环境变量推导，无需改本文件即可切换平台。
#
# Token 来源（两平台均自动注入，无需手工建同名的）：
#   GitHub : secrets.GITHUB_TOKEN（平台自动注入，不可手工创建）
#   Forgejo: FORGEJO_TOKEN 与 GITHUB_TOKEN 两个变量都会被设置（互为镜像）
# 因此回退链 GITHUB_TOKEN || FORGEJO_TOKEN 在两边都能取到值。

name: Build and Release (Forgejo)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.4)"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "rust/aegis/Cargo.toml"

# Forgejo 忽略 permissions:（官方差异清单明确列出）。
# OIDC 用 enable-openid-connect，而非 permissions: id-token: write。
# 写权限由 Forgejo 自动注入的 FORGEJO_TOKEN / GITHUB_TOKEN 提供，
# 或使用 Authorized Integrations（集成授权）。
enable-openid-connect: true

jobs:
  # ---- 阶段 1：构建（纯只读，可在任何平台跑）----
  # 不写仓库、不建 tag、不碰 API。只产出 dist/ 两个二进制。
  # 因此这个 job 在 GitHub / Forgejo / 本地 行为完全一致，
  # 也不会在镜像站上产生「自己 bump 版本」的分叉 commit。
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(deps)')"
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # 用原生 git 代替 actions/checkout：Forgejo 无需镜像或开启 GitHub action 拉取。
      - name: Checkout Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git"
          git config --local http.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch -q --prune --no-tags origin "$GITHUB_SHA"
          git checkout -q --force "$GITHUB_SHA"
          git fetch -q --prune --tags origin || true
          git config --local http.extraheader ""

      - name: Resolve Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version || github.event.inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version' rust/aegis/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            echo "::error::无法解析版本号"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      # mise 是唯一工具来源（mise.toml: rust/protoc/upx/go/garble）。
      # 用官方安装脚本而非 jdx/mise-action，使其在 GitHub 与 Forgejo 上完全相同。
      - name: Setup mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install --yes
          "$HOME/.local/bin/mise" --version

      # 缓存是可选加速，两个平台都可缺失。continue-on-error 避免 Forgejo 无
      # actions/cache 时整条工作流失败；缓存后端不可用只是变慢，不影响产物。
      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/aegis/target/release/.fingerprint
            rust/aegis/target/release/build
            rust/aegis/target/release/deps
          key: ${{ runner.os }}-rust-aegis-${{ hashFiles('rust/aegis/Cargo.lock', 'rust/aegis/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-aegis-

      - name: Cache Go build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/garble
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-installer-${{ hashFiles('go/installer/go.sum', 'go/installer/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-installer-

      # 刻意不使用 sccache：其唯一后端 SCCACHE_GHA_ENABLED 是 GitHub 专有，
      # 与「跨平台」目标冲突；且 build-test.yml 已实测该后端在本仓库
      # 命中率归零并挤掉 actions/cache 条目（见 build-test.yml 注释）。
      # 发布频率低，直接编译即可；RUSTC_WRAPPER 留空。
      - name: Build Runtime Binary
        run: |
          cd rust/aegis
          RUSTFLAGS="--remap-path-prefix ${{ github.workspace }}=/project" \
          cargo build --release

          ls -lh target/release/aegis
          upx --best --lzma target/release/aegis

      - name: Build Bootstrap Binary
        run: |
          cd go/installer
          CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .

      - name: Prepare Distribution Artifacts
        run: |
          mkdir -p dist
          cp rust/aegis/target/release/aegis dist/
          cp go/installer/installer dist/
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

  # ---- 阶段 2：发布（只应在权威源上跑）----
  # 做三件有副作用的事：回写版本 commit、推 tag、建 release。
  # 权威源 = 本仓库真正的「上游」。默认仅 GitHub；在 Forgejo 上若也要发布，
  # 设 repo 变量 PUBLISH_ENABLED=true 显式开启（避免镜像站分叉）。
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 权威源守卫：
    #   - GitHub 上始终发布（github.server_url 含 github.com）
    #   - 非 GitHub 上默认【不】发布，避免镜像站分叉；
    #     确实要在 Forgejo 上发布时，设 repo 变量 PUBLISH_ENABLED=true 显式开启。
    # 故意用 !contains(...) 而非 contains(...)：若 server_url 意外为空/不可用，
    # 表达式仍为 true → 默认发布（失败安全，不会静默永不发布）。
    if: |
      needs.build.result == 'success' &&
      (!contains(github.server_url, '/') || contains(github.server_url, 'github.com') || vars.PUBLISH_ENABLED == 'true')
    steps:
      - name: Checkout Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git"
          git config --local http.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch -q --prune --no-tags origin "$GITHUB_SHA"
          git checkout -q --force "$GITHUB_SHA"
          git fetch -q --prune --tags origin || true
          git config --local http.extraheader ""

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist

      # 若 artifact 后端不可用（Forgejo 无 upload/download-artifact），
      # 回退为就地重建产物。保证 publish 不因缺 artifact 而空手发布。
      - name: Ensure Dist Artifacts Present
        run: |
          if [ -f dist/aegis ] && [ -f dist/installer ]; then
            echo "artifacts 已就绪"
            ls -lh dist/
            exit 0
          fi
          echo "::warning::dist 缺失，就地重建产物"
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install --yes
          (cd rust/aegis && RUSTFLAGS="--remap-path-prefix ${{ github.workspace }}=/project" cargo build --release && upx --best --lzma target/release/aegis)
          (cd go/installer && CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .)
          mkdir -p dist
          cp rust/aegis/target/release/aegis dist/
          cp go/installer/installer dist/
          ls -lh dist/

      # 权威源才回写版本号：避免镜像站自己 commit 造成分叉。
      - name: Sync Source Version Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CI Bot"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "非手动触发，跳过版本回写"
            exit 0
          fi

          sed -i 's/^version = .*/version = "${{ needs.build.outputs.version }}"/' rust/aegis/Cargo.toml
          if git diff --quiet -- rust/aegis/Cargo.toml; then
            echo "版本未变化，跳过 commit"
            exit 0
          fi

          # 本地可能处于 detached HEAD（Forgejo runner 常见），
          # 必须显式建/更新本地分支再推，否则 `git push origin main` 会报
          # `src refspec main does not match any`。
          git add rust/aegis/Cargo.toml
          git commit -m "chore: bump version to ${{ needs.build.outputs.version }} [skip ci]"
          git branch -f main HEAD
          git push origin main

      - name: Sync Source Tags
        run: |
          git tag -f "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}" --force

      # ---- 发布抽象：一份逻辑，两个 provider ----
      # GitHub:  POST /repos/{owner}/{repo}/releases        + /releases/{id}/assets
      # Forgejo: POST /api/v1/repos/{owner}/{repo}/releases + 同路径 assets
      # 两者 JSON 字段（tag_name/name/body/draft）与 asset 响应结构一致。
      # 平台由 GITHUB_SERVER_URL 推导，未设置时默认 github。
      - name: Resolve Release Provider
        env:
          RAW_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}
        run: |
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          case "$SERVER" in
            *github.com*) PROVIDER=github ;;
            *)            PROVIDER=forgejo ;;
          esac

          case "$PROVIDER" in
            github)
              API_BASE="https://api.github.com"
              ;;
            forgejo)
              API_BASE="${SERVER}/api/v1"
              ;;
            *)
              echo "::error::未知 RELEASE_PROVIDER: $PROVIDER"; exit 1
              ;;
          esac

          echo "RELEASE_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
          echo "RELEASE_API_BASE=$API_BASE" >> "$GITHUB_ENV"
          echo "RELEASE_AUTH_TOKEN=$RAW_TOKEN" >> "$GITHUB_ENV"
          echo "release provider: $PROVIDER ($API_BASE)"

      # 幂等：先删掉同 tag 的旧 release（就是修 GitHub 500 的那一步），
      # 两个 provider 的 delete 端点均可直接用 DELETE 调用。
      - name: Delete Existing Release For Tag
        run: |
          OWNER_REPO="$GITHUB_REPOSITORY"
          EXISTING_ID=$(curl -fsS \
            -H "Authorization: token $RELEASE_AUTH_TOKEN" \
            "$RELEASE_API_BASE/repos/$OWNER_REPO/releases/tags/v${{ needs.build.outputs.version }}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || echo "")

          if [ -n "$EXISTING_ID" ]; then
            echo "deleting existing release id=$EXISTING_ID"
            curl -fsS -X DELETE \
              -H "Authorization: token $RELEASE_AUTH_TOKEN" \
              "$RELEASE_API_BASE/repos/$OWNER_REPO/releases/$EXISTING_ID"
          else
            echo "no existing release for v${{ needs.build.outputs.version }}"
          fi

      - name: Create Release
        run: |
          OWNER_REPO="$GITHUB_REPOSITORY"
          BODY=$(printf 'Release `v%s`.\n\n### Included Files\n- `installer`: bootstrap executable\n- `aegis`: runtime management executable\n' "${{ needs.build.outputs.version }}")

          TAG="v${{ needs.build.outputs.version }}"
          PAYLOAD=$(BODY="$BODY" TAG="$TAG" python3 -c '
          import json,os
          print(json.dumps({
            "tag_name": os.environ["TAG"],
            "name":     os.environ["TAG"],
            "body":     os.environ["BODY"],
            "draft":    False,
          }))
          ')

          RESP=$(curl -fsS -X POST \
            -H "Authorization: token $RELEASE_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$RELEASE_API_BASE/repos/$OWNER_REPO/releases")

          RID=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"
          echo "created release id=$RID"

      - name: Upload Release Assets
        run: |
          OWNER_REPO="$GITHUB_REPOSITORY"
          for f in dist/aegis dist/installer; do
            [ -f "$f" ] || { echo "::error::缺少产物 $f"; exit 1; }
            NAME=$(basename "$f")
            echo "uploading $NAME"
            curl -fsS -X POST \
              -H "Authorization: token $RELEASE_AUTH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$RELEASE_API_BASE/repos/$OWNER_REPO/releases/$RELEASE_ID/assets?name=$NAME"
          done

      # 仅 GitHub 有独立签名的 workflow_dispatch；Forgejo 上跳过。
      - name: Dispatch Signing Workflow
        if: env.RELEASE_PROVIDER == 'github'
        run: |
          curl -fsS -X POST \
            -H "Authorization: token $RELEASE_AUTH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$RELEASE_API_BASE/repos/$GITHUB_REPOSITORY/actions/workflows/sign-release.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag_name\":\"v${{ needs.build.outputs.version }}\"}}"
