name: Build Windows sni_probe

# 手动触发（workflow_dispatch）。在真实 Windows runner 上原生构建。
#
# 关于 BoringSSL 的两个坑（均已在下方 step 中处理）：
#
# 1) 交叉编译（Ubuntu+mingw）时 CMake 的 FindThreads 会把 `-pthread` 泄漏到
#    CMAKE_ASM_NASM_FLAGS，nasm 解释为 `-p thread`（预包含名为 thread 的文件）而失败。
#    在 Windows 原生构建时 boring-sys 命中
#      `"windows" if config.host.contains("windows") => OPENSSL_NO_ASM=YES`
#    直接关闭 BoringSSL 汇编，不再有 nasm 参与，此坑自然消失。
#
# 2) 原生 MSVC 构建时，runner 预设的 CFLAGS 含 `-Brepro`，它被 cmake 传给
#    MSBuild 后与 FileTracker 冲突：
#      FileTracker : error FTK1011: could not create the new file tracking log file
#    因此构建前清空 CFLAGS/CXXFLAGS，避免污染 BoringSSL 的 CMake 配置。
#
# Windows 平台限制：--iface 只支持按本地 IP 绑定，不支持按网卡名
# （Windows 无 SO_BINDTODEVICE 等价物）；给网卡名会明确报错。
on:
  # PR 里只编译 Windows 目标（`cargo check`，不链接、不跑测试），
  # 让 `cfg(windows)` 代码不会在合并前带着编译错误溜进主分支。
  # 真正的原生构建+测试仍由下面的 workflow_dispatch 负责。
  pull_request:
    paths:
      - 'sni_probe/**'
      - '.github/workflows/build-sni-probe-windows.yml'
  workflow_dispatch:
    inputs:
      release:
        description: '构建后创建 GitHub Release 并附上 exe'
        type: boolean
        default: false
      version:
        description: 'Release 标签（留空则用 sni_probe-v{run_number}）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：只 check，不链接（ring/boring 的 C 依赖在 check 下不必真编译）。
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sni_probe
          key: windows-check
      - name: cargo check (x86_64-pc-windows-msvc)
        working-directory: sni_probe
        run: |
          cargo check --all-targets
          if ($LASTEXITCODE -ne 0) { throw "cargo check 失败，exit=$LASTEXITCODE" }

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # 关键：清空 runner 预设的 CFLAGS/CXXFLAGS。
      # windows-latest 默认带 `-nologo -MD -Brepro -W0`，其中 -Brepro 会让
      # MSVC 的 FileTracker 无法创建 tlog 目录（FTK1011），导致 CMake 的
      # 编译器探测直接失败。
      CFLAGS: ''
      CXXFLAGS: ''
      # 缩短 BoringSSL 的构建路径，规避 Windows 深层路径限制
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Ensure cmake + nasm
        run: |
          foreach ($t in @(@{n='cmake';c='cmake'}, @{n='nasm';c='nasm'}, @{n='cl';c='cl'})) {
            $p = Get-Command $t.c -ErrorAction SilentlyContinue
            if ($p) { Write-Host "$($t.n) : $($p.Source)" } else { Write-Host "$($t.n) : 缺失" }
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sni_probe
          key: windows-msvc-v2

      # 显式验证 CMake 能探测到编译器：把本次踩到的 FTK1011 变成早期可见的失败，
      # 而不是等到 BoringSSL 深处才炸。
      - name: Preflight — CMake 编译器探测
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'cmake-preflight'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Content -Path "$d\CMakeLists.txt" -Value @'
          cmake_minimum_required(VERSION 3.20)
          project(preflight C)
          add_executable(hello hello.c)
          '@
          Set-Content -Path "$d\hello.c" -Value 'int main(void){return 0;}'
          # 不硬编码生成器版本（runner 可能是 VS 17 2022 或 18 2026），
          # 让 CMake 选默认的 Visual Studio 生成器。
          cmake -S $d -B "$d\build"
          if ($LASTEXITCODE -ne 0) { throw "CMake 编译器探测失败（exit=$LASTEXITCODE）" }
          cmake --build "$d\build" --config Release
          if ($LASTEXITCODE -ne 0) { throw "CMake 试编译失败（exit=$LASTEXITCODE）" }
          Write-Host '✅ CMake + MSVC 探测通过'

      - name: Build
        working-directory: sni_probe
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CFLAGS=[$env:CFLAGS]  CXXFLAGS=[$env:CXXFLAGS]"
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build 失败，exit=$LASTEXITCODE" }

      - name: Run unit tests
        working-directory: sni_probe
        run: |
          # 只跳过真正依赖外网的测试（--skip 是子串匹配，写得越精确越好）：
          #   live_targets_classify_correctly  需真握手真实站点
          #   downloads_real_mmdb_when_opted_in 需下载 MMDB
          #   resolves_public_domain           需海外 DNS
          # resource::live_probe 只读 getrlimit，不联网，必须跑（验证 Windows 分支）。
          cargo test --release --target x86_64-pc-windows-msvc -- `
            --skip live_targets_classify `
            --skip downloads_real_mmdb `
            --skip resolves_public_domain
          if ($LASTEXITCODE -ne 0) { throw "cargo test 失败，exit=$LASTEXITCODE" }

      - name: Verify exe
        run: |
          $ErrorActionPreference = 'Stop'

          # 这个 step 刻意跑一个「预期内失败」的命令（--iface 给网卡名，exit 1）。
          # 坑：PowerShell 7 的 $PSNativeCommandUseErrorActionPreference 会把
          # 原生命令的非零退出码翻成 ##[error] 注解，step 就判失败 —— 无论
          # 断言是否全对；改 $ErrorActionPreference、用 exit 0 都救不回来。
          # 所以：局部关掉这个开关（try/finally 复原）。
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release\sni_probe.exe'
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }

          Get-Item $exe | Format-List Name, Length, LastWriteTime

          # PE 头校验
          $fs = [System.IO.File]::OpenRead($exe)
          try {
            $hdr = New-Object byte[] 2
            $fs.Read($hdr, 0, 2) | Out-Null
            if ($hdr[0] -ne 0x4D -or $hdr[1] -ne 0x5A) { throw '不是 PE 文件（缺 MZ 头）' }
          } finally { $fs.Close() }
          Write-Host '✅ PE 头校验通过'

          # 真正运行，验证 Windows 平台分支
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw '--version 执行失败' }

          Write-Host '--- --list-ifaces（Windows 不支持按网卡绑定，应为空且不报错）---'
          & $exe --list-ifaces
          if ($LASTEXITCODE -ne 0) { throw '--list-ifaces 执行失败' }

          Write-Host '--- --iface 给网卡名应明确报错（提示改用 IP）---'
          $out = & $exe --iface Ethernet merge -d $env:RUNNER_TEMP -o "$env:RUNNER_TEMP\x.pb" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw '期望非零退出码，实际 exit=0' }
          if ($out -notmatch '不支持按网卡名绑定') {
            throw "期望出现「不支持按网卡名绑定」提示，实际输出：$out"
          }
          Write-Host "✅ 预期内失败（exit=$code）且提示正确"

          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + '  sni_probe.exe' |
            Out-File -Encoding ascii "$exe.sha256"
          Get-Content "$exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sni_probe-windows-x86_64-msvc
          path: |
            ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-msvc/release/sni_probe.exe
            ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-msvc/release/sni_probe.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { "sni_probe-v$($env:RUN_NUMBER)" }
          $dir = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release'
          $exe = "$dir\sni_probe.exe"
          $sha = "$dir\sni_probe.exe.sha256"

          $notes = @'
          Windows 原生构建（x86_64-pc-windows-msvc）。

          **平台限制**：`--iface` 只支持按本地 IP 绑定，不支持按网卡名
          （Windows 无 `SO_BINDTODEVICE` 等价物）。给网卡名会明确报错并提示改用 IP。

          校验（PowerShell）：
          ```powershell
          (Get-FileHash .\sni_probe.exe -Algorithm SHA256).Hash
          ```
          '@

          gh release create $tag $exe $sha --title "sni_probe $tag (Windows x86_64)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release 失败，exit=$LASTEXITCODE" }
          Write-Host "已发布 $tag"
