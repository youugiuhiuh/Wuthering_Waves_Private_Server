name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.4)"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "rust/aegis/Cargo.toml"

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(deps)')"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve Version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -m1 '^version' rust/aegis/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          VERSION=${VERSION#v}
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Update Version in Cargo.toml (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/^version = .*/version = "'${{ env.NEW_VERSION }}'"/' rust/aegis/Cargo.toml

      - name: Sync Source Tags
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            git add rust/aegis/Cargo.toml
            git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
            git push origin main
          fi

          git tag -f "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}" --force

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/aegis -> target"

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          install-only: true

      - name: Build Runtime Binary
        run: |
          cd rust/aegis
          RUSTFLAGS="--remap-path-prefix ${{ github.workspace }}=/project" \
          cargo build --release

          ls -lh target/release/aegis
          upx --best --lzma target/release/aegis

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: go/installer/go.sum

      - name: Install Garble
        run: go install mvdan.cc/garble@latest

      - name: Build Bootstrap Binary
        run: |
          cd go/installer
          CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 $(go env GOPATH)/bin/garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .

      - name: Prepare Distribution Artifacts
        run: |
          mkdir -p dist
          cp rust/aegis/target/release/aegis dist/
          cp go/installer/installer dist/

      - name: Cleanup Old Releases (Keep Last 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --limit 100 -L 100 | sort -t$'\t' -k3 -r | cut -f 3)

          COUNT=0
          for tag in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 3 ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          echo "Kept $((COUNT > 3 ? 3 : COUNT)) releases, deleted $((COUNT > 3 ? COUNT - 3 : 0)) old releases"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          files: |
            dist/aegis
            dist/installer
          body: |
            Release `v${{ env.NEW_VERSION }}`.

            ### Included Files
            - `installer`: bootstrap executable
            - `aegis`: runtime management executable
