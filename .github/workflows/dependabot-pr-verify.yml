name: Dependabot PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 由 update-labels 在 job 级临时提权；工作流默认只读
permissions:
  contents: read

concurrency:
  group: dependabot-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1. 探测任务：找出哪个项目变了。本项目矩阵固定，成本可忽略。
  detect-changes:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Dynamic Matrix
        id: set-matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PROJECTS='[
            {"name": "rust-aegis", "path": "rust/aegis", "language": "rust"},
            {"name": "go-installer", "path": "go/installer", "language": "go"},
            {"name": "sni-tester", "path": "sni_tester", "language": "go"},
            {"name": "github-actions", "path": ".github/workflows", "language": "gha"}
          ]'

          CHANGED_JSON=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | jq -R -s 'split("\n") | map(select(length > 0))')

          FILTERED_PRJ=$(jq -c -n \
            --argjson projs "$PROJECTS" \
            --argjson files "$CHANGED_JSON" \
            '$projs | [ .[] | select(.path as $p | any($files[]; startswith($p))) ]')

          echo "最终需要测试的项目: $FILTERED_PRJ"
          echo "matrix=$FILTERED_PRJ" >> "$GITHUB_OUTPUT"

  # 2. 测试任务：动态接收上一步的结果并应用缓存
  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # ---------------- Go 环境与缓存 ----------------
      - name: Setup Go
        if: matrix.project.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: ${{ matrix.project.path }}/go.sum

      # ---------------- Rust 环境与缓存 ----------------
      - name: Setup Rust
        if: matrix.project.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust Cache
        if: matrix.project.language == 'rust'
        uses: Swatinem/rust-cache@v2.9.2
        with:
          # Monorepo：显式指定工作区路径，防止多项目间缓存互相污染
          workspaces: ${{ matrix.project.path }}

      - name: Install protoc
        if: matrix.project.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # ---------------- 构建与测试 ----------------
      # 注意：rust/aegis/src/bootstrap.rs 会调用 xray 取 mldsa65 密钥生成 Reality PQ。
      # 依赖 `youugiuhiuh/Xray-setup@1`（不可信第三方 Action，且会 sudo 执行远端脚本）已移除；
      # aegis 在缺失该二进制时仅记录日志，不影响 cargo test。
      - name: Build and Test
        working-directory: ${{ matrix.project.path }}
        env:
          LANG: ${{ matrix.project.language }}
        run: |
          case "$LANG" in
            go)   go test ./... ;;
            rust) cargo test ;;
            *)
              echo "🔍 检查 GitHub Actions YAML 语法..."
              python3 -c "
          import glob, sys, yaml
          files = sorted(glob.glob('*.yml') + glob.glob('*.yaml'))
          if not files:
              print('未找到工作流文件'); sys.exit(1)
          bad = False
          for f in files:
              try:
                  with open(f) as s:
                      yaml.safe_load(s)
              except Exception as e:
                  print(f'{f}: {e}'); bad = True
          sys.exit(1 if bad else 0)
          "
              ;;
          esac

  # 3. 统一标签管理（唯一的写权限边界，仓库是否只允许 automerge 标签合并由分支保护决定）
  update-labels:
    needs: [detect-changes, test]
    if: always() && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # auto-merge 需要
      issues: write
      pull-requests: write
    steps:
      - name: Update PR Labels
        uses: actions/github-script@v9.0.0
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { TEST_RESULT, DETECT_RESULT } = process.env;

            const passed =
              DETECT_RESULT === 'success' &&
              (TEST_RESULT === 'success' || TEST_RESULT === 'skipped');

            const label = passed ? 'automerge' : 'automerge-failed';
            const removeLabel = passed ? 'automerge-failed' : 'automerge';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: removeLabel
              });
            } catch (e) {
              core.info(`标签 ${removeLabel} 不存在，跳过移除`);
            }

            // 关键：必须在本 run 内直接开启 auto-merge，不能只贴标签就指望
            // dependabot-pr-handler.yml 接手。GitHub 规定「用 GITHUB_TOKEN 产生的
            // 事件不会再触发新的 workflow run」（防递归），而 automerge 标签正是
            // 本步骤用 GITHUB_TOKEN 贴的 —— 所以 handler 的
            // `on: pull_request_target: labeled` 永远不会触发。
            //
            // 后果（实测）：8 个 dependabot PR 全部 autoMerge=OFF。
            // #257 的 test 全绿、automerge 标签已贴，但 00:36:21 的贴标签事件
            // 没有产生任何 run（同期只有 00:35:55 由 dependabot 自己贴标签的 run）。
            if (!passed) {
              core.info('验证未通过，不开启 auto-merge');
              return;
            }
            // 仅对 dependabot 自己的 PR 操作，避免把人工 PR 也自动合并
            // （github-script v9 已注入 `exec`，无需 require）
            const author = context.payload.pull_request.user.login;
            if (author !== 'dependabot[bot]') {
              core.info(`PR 作者为 ${author}，跳过 auto-merge`);
              return;
            }

            // 开启失败只告警，不让整个流程变红 —— 标签已经贴对了。
            try {
              await exec.exec('gh', [
                'pr', 'merge', '--auto', '--squash', String(context.issue.number)
              ]);
              core.info('已开启 auto-merge（SQUASH），待必需检查通过后自动合并');
            } catch (e) {
              core.warning(`开启 auto-merge 失败: ${e.message}`);
            }

  # 4. 验证失败的 PR 直接关闭（原先在 dependabot-pr-handler.yml 里，同样因为
  #    GITHUB_TOKEN 事件不触发 workflow 而从未执行过 —— #259~#262 长期挂着
  #    automerge-failed 标签无人清理）
  close-failed:
    needs: [detect-changes, test, update-labels]
    if: |
      always() &&
      needs.update-labels.result == 'success' &&
      needs.test.result != 'success' &&
      needs.test.result != 'skipped' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Close Failed PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --comment "❌ Automated verification failed. Closing this Dependabot PR." \
            --delete-branch
