name: Dependabot PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      # Rust 构建 & 测试
      - name: Rust setup
        if: ${{ github.event.pull_request.title contains 'rust/tgbot' }}
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          cd rust/tgbot && cargo build --release && cargo test

      # Go 构建 & 测试
      - name: Setup Go
        if: ${{ github.event.pull_request.title contains 'sni_tester' || github.event.pull_request.title contains 'go/installer' }}
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
      - name: Go build & test
        if: ${{ github.event.pull_request.title contains 'sni_tester' }}
        run: cd sni_tester && go build -o sni_tester . && go test ./...
      - name: Go build & test
        if: ${{ github.event.pull_request.title contains 'go/installer' }}
        run: cd go/installer && go build -o installer . && go test ./...

      # 成功 → 添加 automerge 标签
      - name: Add automerge label
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['automerge']
            })

      # 失败 → 添加 automerge-failed 标签
      - name: Add failed label
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['automerge-failed']
            })
