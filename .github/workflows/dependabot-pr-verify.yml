name: Dependabot PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    # 仅在 Dependabot 提交 PR 时运行，节省 Action 分钟数
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false # 即使其中一个项目失败，其他项目也继续测试
      matrix:
        project:
          - { name: "rust-tgbot", path: "rust/tgbot", language: "rust" }
          - { name: "go-installer", path: "go/installer", language: "go" }
          - { name: "sni-tester", path: "sni_tester", language: "go" }
          - { name: "github-actions", path: ".github", language: "gha" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要获取历史记录以进行 diff 检查

      - name: Determine if project changed
        id: check
        run: |
          # 检查 base 分支和当前提交之间的差异
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} ${{ github.sha }} | grep "^${{ matrix.project.path }}" || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # ---------------- 环境配置 (加速优化) ----------------
      - name: Setup Go
        if: steps.check.outputs.changed == 'true' && matrix.project.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: ${{ matrix.project.path }}/go.sum

      - name: Setup Rust
        if: steps.check.outputs.changed == 'true' && matrix.project.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # ---------------- 构建与测试 ----------------
      - name: Build and Test
        if: steps.check.outputs.changed == 'true'
        run: |
          cd ${{ matrix.project.path }}
          if [ "${{ matrix.project.language }}" = "go" ]; then
            go test ./...
          elif [ "${{ matrix.project.language }}" = "rust" ]; then
            cargo test
          else
            echo "🔍 开始内联检查 GitHub Actions YAML 语法..."
            python3 -c "
          import yaml, glob, sys
          files = glob.glob('workflows/*.yml') + glob.glob('workflows/*.yaml')
          if not files:
              print('❌ 未找到任何工作流文件！')
              sys.exit(1)

          has_error = False
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as stream:
                      yaml.safe_load(stream)
                  print(f'✅ {f} 语法正确')
              except Exception as e:
                  print(f'❌ {f} 语法错误:\n{e}')
                  has_error = True

          if has_error:
              sys.exit(1)
          "
          fi

      # ---------------- 标签管理 ----------------
      - name: Update PR Labels
        if: steps.check.outputs.changed == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "${{ job.status }}" === "success" ? "automerge" : "automerge-failed";
            const removeLabel = "${{ job.status }}" === "success" ? "automerge-failed" : "automerge";

            // 添加新标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

            // 尝试移除旧标签（避免冲突）
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: removeLabel
              });
            } catch (e) {}
