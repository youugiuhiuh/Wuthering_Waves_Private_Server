name: Dependabot PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    if: ${{ github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        project:
          - name: rust-tgbot
            path: rust/tgbot
            language: rust
          - name: go-installer
            path: go/installer
            language: go
          - name: sni-tester
            path: sni_tester
            language: go
          - name: github-actions
            path: .github
            language: gha # GitHub Actions workflow

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine if project changed
        id: check
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} ${{ github.sha }})
          if echo "$CHANGED_FILES" | grep -q "${{ matrix.project.path }}"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no changes
        if: ${{ steps.check.outputs.changed == 'false' }}
        run: |
          echo "No changes in ${{ matrix.project.path }}, skipping..."
          exit 0

      - name: Setup environment
        run: |
          if [ "${{ matrix.project.language }}" = "go" ]; then
            echo "Setting up Go..."
            sudo apt-get update
            sudo apt-get install -y golang-go
          elif [ "${{ matrix.project.language }}" = "rust" ]; then
            echo "Setting up Rust..."
            sudo apt-get update
            sudo apt-get install -y cargo protobuf-compiler
          else
            echo "Setting up environment for GitHub Actions workflow validation..."
            # 这里只是检查 YAML 是否合法
            sudo apt-get update
            sudo apt-get install -y yamllint
          fi

      - name: Build and Test
        run: |
          cd ${{ matrix.project.path }}
          if [ "${{ matrix.project.language }}" = "go" ]; then
            go build -o ${{ matrix.project.name }} .
            go test ./...
          elif [ "${{ matrix.project.language }}" = "rust" ]; then
            cargo build --release
            cargo test
          else
            # GitHub Actions workflow 格式化检查
            yamllint .
          fi

      - name: Add automerge label
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['automerge']
            })

      - name: Add failed label
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['automerge-failed']
            })
