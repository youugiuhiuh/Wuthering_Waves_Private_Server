name: Rebase Dependabot PRs

on:
  push:
    branches:
      - main # 当主分支更新时触发

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get open Dependabot PRs
        uses: peter-evans/find-pull-requests@v5
        id: find_prs
        with:
          author: dependabot[bot]
          state: open
          base: main

      - name: Rebase PRs on latest main
        if: steps.find_prs.outputs.pull_request_numbers != ''
        run: |
          echo "${{ steps.find_prs.outputs.pull_request_numbers }}" | tr ',' '\n' | while read pr; do
            echo "Rebasing PR #$pr"
            gh pr checkout $pr
            git fetch origin main
            git rebase origin/main
            git push --force-with-lease
          done
