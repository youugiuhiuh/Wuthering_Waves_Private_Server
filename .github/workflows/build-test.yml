name: Build and Test

# 作者无关：人类 PR 与机器人 PR 一律走同一道门禁。
# 这是本工作流存在的理由 —— 旧 dependabot-pr-verify.yml 把门禁绑在
# `github.event.pull_request.user.login == 'dependabot[bot]'` 上，
# 导致人类 PR 反而没有任何构建/测试约束。
#
# 本工作流是纯只读的，没有任何写操作（不贴标签、不合并、不关 PR），
# 因此可以安全地设为分支保护的 required status check。
# 自动合并由 Renovate 原生 platformAutomerge 完成。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # 合并到 main 后再跑一次，作为 target 缓存的唯一写入路径（B3 策略）。
  # PR 上只读缓存，避免每个依赖更新 PR 各写一份 677MB 把 10GB 配额挤爆。
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # push 分支下 github.event.pull_request.number 为空，回退到 run_id 避免所有 main 运行互相取消
  group: build-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # 探测哪个项目变了。矩阵生成逻辑与作者无关，沿用旧工作流的实现。
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Dynamic Matrix
        id: set-matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PROJECTS='[
            {"name": "rust-aegis", "path": "rust/aegis", "language": "rust"},
            {"name": "go-installer", "path": "go/installer", "language": "go"},
            {"name": "sni-tester", "path": "sni_tester", "language": "go"},
            {"name": "github-actions", "path": ".github/workflows", "language": "gha"}
          ]'

          CHANGED_JSON=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | jq -R -s 'split("\n") | map(select(length > 0))')

          FILTERED_PRJ=$(jq -c -n \
            --argjson projs "$PROJECTS" \
            --argjson files "$CHANGED_JSON" \
            '$projs | [ .[] | select(.path as $p | any($files[]; startswith($p))) ]')

          echo "最终需要测试的项目: $FILTERED_PRJ"
          echo "matrix=$FILTERED_PRJ" >> "$GITHUB_OUTPUT"

  # 真实编译 + 真实测试。
  # 注意：仅改动 .github/workflows 时矩阵为空，本 job 会被 skip —— 这是预期行为，
  # skipped 不阻塞合并。
  build-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # ---------------- Go 环境与缓存 ----------------
      # `cache: true` 只缓存模块下载（~/go/pkg/mod），不缓存编译产物。
      # 真正花时间的是编译，所以下面另外用 actions/cache 缓存 ~/.cache/go-build。
      - name: Setup Go
        if: matrix.project.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: ${{ matrix.project.path }}/go.sum

      # `setup-go` 的 `cache: true` 已负责 ~/go/pkg/mod（模块下载）。
      # 这里只补它不做的部分：编译产物 ~/.cache/go-build。
      # 刻意不重复包含 ~/go/pkg/mod —— 两套机制用不同 key 写同一路径会双重占用 10GB 配额。
      - name: Restore Go build outputs
        if: matrix.project.language == 'go'
        id: go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ matrix.project.name }}-gobuild-${{ hashFiles(format('{0}/go.sum', matrix.project.path), format('{0}/go.mod', matrix.project.path)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.project.name }}-gobuild-

      # ---------------- Rust 环境与缓存 ----------------
      - name: Setup Rust
        if: matrix.project.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # 刻意不使用 sccache，实测它与本仓库不兼容：
      #
      # sccache 的 GHA 后端把【每个编译产物】存成独立的缓存条目，
      # 单次 run 就产生数百个小条目（实测 run 34744829678：851 次写入）。
      # 这些细粒度条目会通过 LRU 把粗粒度缓存挤光，实测后果：
      #   sccache 条目 30 个 / 141MB
      #   actions/cache 条目 0 个        ← target 缓存被完全挤掉
      #   总用量 141MB / 10GB            ← 远未超限，纯粹是互相淘汰
      #
      # 命中率也因此归零（同一次 run）：
      #   compile_requests 1099 / cache_writes 851
      #   cache_hits       C/C++ 3
      #   cache_misses     Rust 517, Assembler 140, C/C++ 273
      # 即 Rust 517 次编译全部 miss。原因是 GitHub 托管 runner 是一次性的，
      # sccache 没有持久本地磁盘兜底。
      #
      # 这是 sccache GHA 后端的已知缺陷（mozilla/sccache#2566、#2730）：
      # 另有每仓库每分钟 200 次缓存上传的限流，多 PR 并发时必被打爆。
      # 上游社区的做法就是直接关闭 SCCACHE_GHA_ENABLED。
      #
      # 因此改用单一条目的 target 缓存（见下），避免细粒度条目互杀。
      # public-release.yml 仍保留 sccache：release 频率低，影响可控。
      #
      # target 缓存：只在 main 上写，PR 上只读（B3 策略）。
      #
      # 背景：每个依赖更新 PR 的 Cargo.lock 都不同 → hashFiles 不同 → key 每次全新。
      # 每个 PR 写 677MB，十来个 PR 就会撞上 GitHub 每仓库 10GB 上限，
      # 触发 LRU 淘汰，导致后续 PR 反而无可用缓存（实测总量曾达 11.3GB）。
      #
      # 让 PR 只读、main 写，缓存总量就只随依赖变更增长，不随 PR 数量增长。
      #
      # 只缓存 release 的 deps/build/.fingerprint 三个目录，不碰 target/debug/**：
      # 本地实测 target/debug/deps 达 54GB，超出 10GB 上限，加进去会永远存不进。
      - name: Restore Rust build outputs
        if: matrix.project.language == 'rust'
        id: rust-target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ${{ matrix.project.path }}/target/release/.fingerprint
            ${{ matrix.project.path }}/target/release/build
            ${{ matrix.project.path }}/target/release/deps
          key: ${{ runner.os }}-${{ matrix.project.name }}-rust-${{ hashFiles(format('{0}/Cargo.lock', matrix.project.path), format('{0}/Cargo.toml', matrix.project.path)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.project.name }}-rust-

      - name: Install protoc
        if: matrix.project.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # 用预编译二进制，不编译 nextest（官方推荐的 CI 安装方式）。
      # 与 rust-lint-format 技能保持一致：该技能要求的门禁是
      # `cargo nextest run`，而非 `cargo test`。
      - name: Install cargo-nextest
        if: matrix.project.language == 'rust'
        uses: taiki-e/install-action@nextest

      # ---------------- 真实编译 + 真实测试 ----------------
      # 编译门禁分两层：
      #   Rust: `cargo build --release` 验证发布构建（nextest 只编译 test target，
      #         不覆盖 release profile —— 而发布走的正是 release）；
      #         `cargo nextest run` 编译并运行测试。
      #   Go:   `go build ./...` 编译全部包；`go test ./...` 跑测试。
      #
      # 刻意不在此处加 `cargo clippy -- -D warnings`：依赖更新 PR 上
      # 新版第三方依赖可能引入新 lint，会导致更新流程被永久卡死，
      # 且无法通过修改本仓库代码解决。clippy 保持在本地按技能要求执行。
      #
      # 注意：rust/aegis/src/bootstrap.rs 会调用 xray 取 mldsa65 密钥生成 Reality PQ。
      # 依赖 `youugiuhiuh/Xray-setup@1`（不可信第三方 Action，且会 sudo 执行远端脚本）已移除；
      # aegis 在缺失该二进制时仅记录日志，不影响测试。
      - name: Build and Test
        working-directory: ${{ matrix.project.path }}
        env:
          LANG: ${{ matrix.project.language }}
          CARGO_TERM_COLOR: always
        run: |
          case "$LANG" in
            go)
              go build ./...
              go test ./...
              ;;
            rust)
              cargo build --release
              cargo nextest run --cargo-profile fast-test
              ;;
            *)
              echo "🔍 检查 GitHub Actions YAML 语法..."
              python3 -c "
          import glob, sys, yaml
          files = sorted(glob.glob('*.yml') + glob.glob('*.yaml'))
          if not files:
              print('未找到工作流文件'); sys.exit(1)
          bad = False
          for f in files:
              try:
                  with open(f) as s:
                      yaml.safe_load(s)
              except Exception as e:
                  print(f'{f}: {e}'); bad = True
          sys.exit(1 if bad else 0)
          "
              ;;
          esac

      # 缓存写入：仅在 main 上（B3 策略）。
      #
      # 必须放在构建之后，才能把本次编译产物存进去。
      # `actions/cache/restore` 不会自动保存，需要显式调 save。
      # 用 `github.ref == refs/heads/main` 判定：PR 运行只读，不消耗 10GB 配额。
      - name: Save Rust build outputs
        if: matrix.project.language == 'rust' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ${{ matrix.project.path }}/target/release/.fingerprint
            ${{ matrix.project.path }}/target/release/build
            ${{ matrix.project.path }}/target/release/deps
          key: ${{ steps.rust-target-cache.outputs.cache-primary-key }}

      - name: Save Go build outputs
        if: matrix.project.language == 'go' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  # 分支保护的 required status check 指向本 job，而非矩阵 job `build-test`。
  #
  # 原因：`build-test` 是矩阵 job，GitHub 在 ruleset 的下拉里会把带矩阵参数的
  # 形态显示成 `build-test (github-actions, .github/workflows, gha)`，但实际
  # check 名只有 `build-test` —— 把带括号那串写进 ruleset 会永远等不到，PR 永久
  # BLOCKED（实测 ruleset 16422308）。
  #
  # 另一个原因：`build-test` 在矩阵为空时（只改文档/配置的 PR）是 skipped。
  # 而 required check 对 skipped 的处理不确定，会让这类 PR 卡死。
  #
  # 本 job 名字固定、`if: always()` 必定运行，把「skipped 算不算通过」
  # 变成下面显式的一行判断，不再依赖 GitHub 的模糊行为。
  #
  # 它没有任何 checkout / 读写 / 秘钥，只是一个结果汇总判断，因此
  # 作为 required check 不引入任何权限风险。
  build-test-gate:
    needs: [detect-changes, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate build-test result
        env:
          DETECT: ${{ needs.detect-changes.result }}
          BUILD: ${{ needs.build-test.result }}
        run: |
          echo "detect-changes: $DETECT"
          echo "build-test:     $BUILD"

          # detect-changes 必须成功，否则矩阵本身不可信
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect-changes 未成功（$DETECT），门禁不通过"
            exit 1
          fi

          # success: 真实跑过编译+测试并通过
          # skipped: 本次改动不涉及四个项目（如仅改文档/renovate.json）
          #          这是预期行为，放行
          case "$BUILD" in
            success)
              echo "✅ 构建与测试通过"
              ;;
            skipped)
              echo "✅ 本次改动不涉及受测项目，无需构建（预期）"
              ;;
            *)
              echo "::error::build-test 未通过（$BUILD）"
              exit 1
              ;;
          esac
