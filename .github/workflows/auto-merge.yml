name: Dependabot Auto Merge (Official)

on:
  workflow_run:
    workflows: ["Dependabot PR Verify"] # 依赖你的 Verify workflow 名称
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # 只在 Verify 成功时启用
    steps:
      - name: Enable GitHub Auto Merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          # PR 要启用自动合并
          pull-request-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          merge-method: squash # squash/rebase/merge
          commit-title: "auto merge: Dependabot PR"
          commit-message: "Merged automatically after verification"
