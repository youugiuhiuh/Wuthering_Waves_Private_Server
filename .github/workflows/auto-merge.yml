name: Dependabot Auto Merge (Official)

on:
  workflow_run:
    workflows: ["Dependabot PR Verify"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    # 【修复 1】必须同时满足：1. Verify 成功 2. 触发原始工作流的人必须是 dependabot
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]' }}

    steps:
      # 【修复 2】不依赖不稳定的 pull_requests[0] 数组，直接用 GitHub CLI 精准定位 PR 号
      - name: Get Pull Request Number
        id: get_pr
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "❌ 未找到对应的 PR，可能已经被合并或关闭"
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Enable GitHub Auto Merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.get_pr.outputs.PR_NUMBER }}
          merge-method: squash
          commit-title: "auto merge: Dependabot PR #${{ steps.get_pr.outputs.PR_NUMBER }}"
          commit-message: "Merged automatically after verification workflow success"
