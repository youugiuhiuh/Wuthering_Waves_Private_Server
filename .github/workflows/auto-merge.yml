name: Dependabot Auto Merge

on:
workflow_run:
workflows:
  - Dependabot PR Verify
types:
  - completed

permissions:
contents: write
pull-requests: write

jobs:
handle-pr:
if: github.event.workflow_run.actor.login == 'dependabot[bot]'
runs-on: ubuntu-latest

steps:
  - name: Get Pull Request Number
    id: pr
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      PR_NUMBER=$(gh pr list \
        --repo "${{ github.repository }}" \
        --head "${{ github.event.workflow_run.head_branch }}" \
        --json number \
        --jq '.[0].number')

      if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
        echo "PR 不存在，可能已关闭或已合并"
        exit 1
      fi

      echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  - name: Enable Auto Merge
    if: github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      gh pr merge \
        --auto \
        --squash \
        "${{ steps.pr.outputs.number }}"

  - name: Close Failed PR
    if: github.event.workflow_run.conclusion != 'success'
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      gh pr close \
        "${{ steps.pr.outputs.number }}" \
        --comment "❌ Automated verification failed. Closing this Dependabot PR."
