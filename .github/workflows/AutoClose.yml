name: Dependabot Failed PR Auto Close

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  close-failed-pr:
    runs-on: ubuntu-latest
    # 【修复】1. 检查打上的标签是不是失败标签 2. 检查这个 PR 的发起人是不是 dependabot
    if: ${{ github.event.label.name == 'automerge-failed' && github.event.pull_request.user.login == 'dependabot[bot]' }}

    steps:
      - name: Close the failed Dependabot PR
        uses: actions/github-script@v9 # 调整为稳定版本
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
            console.log(`Closed Dependabot PR #${context.issue.number} due to failed verification.`);
