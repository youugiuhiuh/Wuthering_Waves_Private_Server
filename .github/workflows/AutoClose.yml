name: Dependabot Failed PR Auto Close

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  close-failed-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'automerge-failed' && github.actor == 'dependabot[bot]' }}
    steps:
      - name: Close the failed Dependabot PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            })
            console.log(`Closed Dependabot PR #${context.issue.number} due to failed verification.`)
