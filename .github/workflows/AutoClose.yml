name: Dependabot Auto Close Failed

on:
  pull_request:
    types:
      - labeled

permissions:
  pull-requests: write

jobs:
  close-failed:
    if: |
      github.actor == 'dependabot[bot]' &&
      github.event.label.name == 'automerge-failed'

    runs-on: ubuntu-latest

    steps:
      - name: Close PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close \
            "${{ github.event.pull_request.number }}" \
            --comment "❌ Verification failed. Closing automatically."
