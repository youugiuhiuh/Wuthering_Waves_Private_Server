name: Dependabot PR Handler

on:
  pull_request_target:
    types:
      - labeled

# 默认只读；只有真正写 PR 的 job 才临时提权
permissions:
  contents: read

jobs:
  automerge:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.label.name == 'automerge'

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"

  close-failed:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.label.name == 'automerge-failed'

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Close Failed PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --comment "❌ Automated verification failed. Closing this Dependabot PR." \
            --delete-branch
