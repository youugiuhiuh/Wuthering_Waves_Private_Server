name: Dependabot PR Handler

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.label.name == 'automerge'

    runs-on: ubuntu-latest

    steps:
      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge \
            --auto \
            --squash \
            "${{ github.event.pull_request.number }}"

  close-failed:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.label.name == 'automerge-failed'

    runs-on: ubuntu-latest

    steps:
      - name: Close Failed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close \
            "${{ github.event.pull_request.number }}" \
            --comment "❌ Automated verification failed. Closing this Dependabot PR."
