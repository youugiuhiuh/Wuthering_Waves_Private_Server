version: 2
updates:
  # 1. 对应项目: rust-aegis
  - package-ecosystem: "cargo"
    directory: "/rust/aegis" # 必须以 / 开头
    schedule:
      interval: "weekly"

  # 2. 对应项目: sni-tester
  - package-ecosystem: "gomod"
    directory: "/sni_tester"
    schedule:
      interval: "weekly"

  # 3. 对应项目: go-installer
  - package-ecosystem: "gomod"
    directory: "/go/installer"
    schedule:
      interval: "weekly"

  # 4. 对应项目: github-actions 自身更新
  - package-ecosystem: "github-actions"
    directory: "/" # 自动识别 .github/workflows 下的 workflow
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
