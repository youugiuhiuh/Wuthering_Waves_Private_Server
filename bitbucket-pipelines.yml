            - echo "Version: $NEW_VERSION"
            - sed -i 's/^version = .*/version = "'"$NEW_VERSION"'"/' rust/tgbot/Cargo.toml
            - git config user.email "ci@bitbucket.org"
            - git config user.name "Bitbucket Pipelines"
            - git add rust/tgbot/Cargo.toml
            - git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || true
            - git push "https://x-token-auth:${SOURCE_REPO_TOKEN}@bitbucket.org/${BITBUCKET_REPO_FULL_SLUG}.git" HEAD:main
            - git tag -f "v${NEW_VERSION}"
            - git push "https://x-token-auth:${SOURCE_REPO_TOKEN}@bitbucket.org/${BITBUCKET_REPO_FULL_SLUG}.git" "v${NEW_VERSION}" --force
            - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            - export PATH="$HOME/.cargo/bin:$PATH"
            - curl -sL "https://go.dev/dl/go1.26.2.linux-amd64.tar.gz" | tar -C /usr/local -xz
            - export PATH="/usr/local/go/bin:$PATH"
            - go install mvdan.cc/garble@latest
            - export PATH="$PATH:$(go env GOPATH)/bin"
            - cd rust/tgbot && RUSTFLAGS="--remap-path-prefix $(pwd)=/project" cargo build --release --locked
            - upx --best --lzma rust/tgbot/target/release/tgbot || true
            - cd go/installer && CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .
            - mkdir -p dist && cp rust/tgbot/target/release/tgbot go/installer/installer dist/
            - |
              for f in dist/tgbot dist/installer; do
                curl -sS -u "${SOURCE_REPO_TOKEN}:x-token-auth" -X POST \
                  "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_FULL_SLUG}/downloads" \
                  -F "files=@${f}"
