      xray status         - Xray コア状態
      xray add <proto> [count] - インバウンド一括作成
      xray del [proto]    - 設定削除
      xray pq status      - PQ キー状態
      xray pq gen         - PQ キー生成

      singbox status      - SingBox 状態
      singbox add <proto> [count] - 一括作成
      singbox del         - 全設定削除

      ops reload          - コア再読み込み
      ops upgrade         - 自己更新
      ops maintenance     - システムメンテナンス (再起動含む)
      ops bbr3            - BBR3 インストール
      ops geo             - GeoData 更新
      ops fw              - ファイアウォール強化

      schedule list       - スケジュール一覧
      schedule add        - スケジュール追加 (ステップ形式)
      schedule del <idx>  - 指定スケジュール削除

      warp status         - WARP 状態
      warp install        - WARP インストール
      warp uninstall      - WARP アンインストール

      destruct            - 自己破壊
