help:
  matrix_text: |
    Available commands (no prefix, send directly):

      auth <code>         - TOTP authentication
      help                - Show this help
      status              - System status
      menu                - Show menu

      xray status         - Xray core status
      xray add <proto> [count] - Batch create inbound
      xray del [proto]    - Delete config
      xray pq status      - PQ key status
      xray pq gen         - Generate PQ key

      singbox status      - SingBox status
      singbox add <proto> [count] - Batch create
      singbox del         - Delete all configs

      ops reload          - Reload core
      ops upgrade         - Self-update
      ops maintenance     - System maintenance (incl. reboot)
      ops bbr3            - Install BBR3
      ops geo             - Update GeoData
      ops fw              - Firewall hardening

      schedule list       - List scheduled tasks
      schedule add        - Add schedule (step by step)
      schedule del <idx>  - Delete specific schedule

      warp status         - WARP status
      warp install        - Install WARP
      warp uninstall      - Uninstall WARP

      destruct            - Self-destruct
