[package]
name = "aegis"
version = "1.3.7"
edition = "2024"

[dependencies]
teloxide = { version = "0.17", features = ["ctrlc_handler", "macros", "rustls"], optional = true, default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
aes-gcm = "0.10"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.9", features = ["derive"] }
totp-rs = { version = "5.7", features = [
    "serde_support",
    "qr",
    "otpauth",
    "gen_secret",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
anyhow = "1.0"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
sysinfo = "0.30"
tokio-cron-scheduler = "0.15.1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
x509-parser = "0.18"
dashmap = "6"

futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
self-replace = "1.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
zbus = { version = "5", features = ["tokio"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
log = "0.4.33"
rust-embed = "8.12.0"
obfstr = "0.4.6"
goldberg = "0.1.0"
chrono-tz = "0.10.4"
prost = "0.14"
thiserror = "2.0"
tempfile = "3.27"
async-trait = "0.1"
matrix-sdk = { version = "0.18", default-features = false, features = [
    "sqlite",
    "e2e-encryption",
] }
mime = "0.3.17"
rust-i18n = "4.2"
minisign-verify = "0.2.5"
mockall = "0.14" # Needed at runtime for binary-crate tests (MockBotAdapter shared across lib/bin)
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend", "http", "builder"] }
poise = { version = "0.6.2", default-features = false, features = ["cache", "chrono", "handle_panics"] }

[dev-dependencies]
env_logger = "0.11.11"
serial_test = "3.5.0"

[build-dependencies]
prost-build = "0.14"

[features]
default = ["telegram"]
telegram = ["dep:teloxide"]
all = ["telegram"]

[profile.release]
opt-level = "z"   # 优化大小，减少特征
codegen-units = 1
panic = "abort"   # 减少标准库符号残留
strip = true      # 移除符号信息
lto = "thin"      # 启用链接时优化，减少二进制大小

[profile.release.build-override]
opt-level = 0
codegen-units = 256

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = 1
strip = "symbols"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = { level = "warn", priority = -1 }
