[package]
name = "aegis"
version = "3.1.6"
edition = "2024"

[dependencies]
teloxide = { version = "0.13", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.7", features = ["derive"] }
totp-rs = { version = "5.5", features = [
    "serde_support",
    "qr",
    "otpauth",
    "gen_secret",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
anyhow = "1.0"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
sysinfo = "0.30"
tokio-cron-scheduler = "0.15.1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.18"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }
percent-encoding = "2.3"
tokio-rustls = "0.24"
rustls = "0.21"
x509-parser = "0.18"
dashmap = "6"

futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
self-replace = "1.3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
zbus = { version = "5", features = ["tokio"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
log = "0.4.32"
rust-embed = "8.11.0"
obfstr = "0.4.4"
goldberg = "0.1.0"
chrono-tz = "0.10.4"
prost = "0.14"
thiserror = "2.0"
tempfile = "3.8"
async-trait = "0.1"
poise = "0.6.2"
serenity = { version = "0.12.5", default-features = false, features = [
    "rustls_backend",
    "http",
] }
matrix-sdk = { version = "0.18", default-features = false, features = [
    "sqlite",
    "e2e-encryption",
] }
mime = "0.3.17"
rust-i18n = "4.1"

[dev-dependencies]
env_logger = "0.11.8"
mockall = "0.14"
serial_test = "3.5.0"

[build-dependencies]
prost-build = "0.14"

[features]
default = ["telegram"]
telegram = ["dep:teloxide"]
all = ["telegram"]

[profile.release]
opt-level = "z"   # 优化大小，减少特征
codegen-units = 1
panic = "abort"   # 减少标准库符号残留
strip = true      # 移除符号信息
lto = "thin"

[profile.release.build-override]
opt-level = 0
codegen-units = 256
