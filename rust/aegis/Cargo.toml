[package]
name = "aegis"
version = "1.5.6"
edition = "2024"

[dependencies]
teloxide = { version = "0.17", features = ["ctrlc_handler", "macros", "rustls"], optional = true, default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
aes-gcm = "0.11.1"
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = { version = "1.9", features = ["derive"] }
totp-rs = { version = "6.0.0", features = ["serde", "qr", "otpauth", "gen_secret"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rmp-serde = "1.3.1"
anyhow = "1.0.104"
base64 = "0.23.1"
rand = "0.10.2"
libc = "0.2.189"
sysinfo = "0.39.6"
tokio-cron-scheduler = "0.15.1"
chrono = { version = "0.4.45", features = ["serde"] }
once_cell = "1.21.4"
sha2 = "0.11"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2.3.2"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "logging", "std", "tls12"] }
x509-parser = "0.18.1"
dashmap = "6.2.1"

futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
regex = "1.13.1"
self-replace = "1.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
zbus = { version = "5.19.0", features = ["tokio"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
log = "0.4.34"
rust-embed = "8.12.0"
obfstr = "0.4.6"
goldberg = "0.1.0"
chrono-tz = "0.10.4"
prost = "0.14.4"
thiserror = "2.0.20"
tempfile = "3.27"
async-trait = "0.1.92"
matrix-sdk = { version = "0.18", default-features = false, features = [
    "sqlite",
    "e2e-encryption",
] }
mime = "0.3.17"
rust-i18n = "4.2.2"
minisign-verify = "0.2.5"
mockall = "0.15.0" # Needed at runtime for binary-crate tests (MockBotAdapter shared across lib/bin)
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend", "http", "builder"] }
poise = { version = "0.7.0", default-features = false, features = ["cache", "chrono", "handle_panics"] }

[dev-dependencies]
env_logger = "0.11.11"
serial_test = "4.0.1"

[build-dependencies]
prost-build = "0.14.4"

[features]
default = ["telegram"]
telegram = ["dep:teloxide"]
all = ["telegram"]

[profile.release]
opt-level = "z"   # 优化大小，减少特征
codegen-units = 1
panic = "abort"   # 减少标准库符号残留
strip = true      # 移除符号信息
lto = "thin"      # 启用链接时优化，减少二进制大小

[profile.release.build-override]
opt-level = 0
codegen-units = 256

# 开发用快速编译 profile（cranelift 后端）
#   RUSTFLAGS="-Zcodegen-backend=cranelift" \
#     cargo +nightly check --profile cranelift-dev
# 需要 nightly + rustc-codegen-cranelift 组件：
#   rustup component add rustc-codegen-cranelift --toolchain nightly
# 后端只能用 RUSTFLAGS 指定：.cargo/config.toml 里的 profile-level
# codegen-backend 会让 stable cargo 直接报错，即使构建的是别的 profile。
[profile.cranelift-dev]
inherits = "dev"
opt-level = 1
debug = 1

# 测试用 profile：编译速度优先，供 cargo nextest run --cargo-profile fast-test 使用。
# 不挂 cranelift：aws-lc-sys（rustls 的 C 依赖，被 matrix-sdk/serenity 强制启用）
# 用 \u{1} 前缀导出符号，只有 LLVM 后端支持，cranelift 链接必然失败。见
# https://github.com/rust-lang/rustc_codegen_cranelift/issues/1520
# opt-level 必须 >= 1：aws-lc-sys 在 O0 下符号名不一致。
[profile.fast-test]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = 1
strip = "symbols"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = { level = "warn", priority = -1 }
