# Azure Pipelines 不联网版：使用预装 Rust/Go/UPX/Garble 的 agent 或 self-hosted 镜像，不执行任何外网下载
# 在 Pipeline 变量中设置: OFFLINE_IMAGE = 你的预装镜像（如 myacr.azurecr.io/wwps-builder:offline）
# 未设置时使用 ubuntu-latest（需在 self-hosted agent 或自定义 pool 中预装 toolchain）

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - rust/tgbot/Cargo.toml

parameters:
  - name: VERSION
    displayName: Release version (manual run)
    type: string
    default: ''

variables:
  PUBLIC_OWNER: $(PUBLIC_REPO_OWNER)
  PUBLIC_REPO: $(PUBLIC_REPO_NAME)
  PUBLIC_SERVER: $(PUBLIC_SERVER_URL)
  ${{ if eq(variables['PUBLIC_OWNER'], '') }}:
    PUBLIC_OWNER: NicholasDewar
  ${{ if eq(variables['PUBLIC_REPO'], '') }}:
    PUBLIC_REPO: Wuthering_Waves_Private_Server
  ${{ if eq(variables['PUBLIC_SERVER'], '') }}:
    PUBLIC_SERVER: https://api.github.com
  OFFLINE_IMAGE: $(CI_OFFLINE_IMAGE)

stages:
  - stage: Build
    jobs:
      - job: build_release_offline
        pool:
          vmImage: $(OFFLINE_IMAGE)
          # 若使用 self-hosted 且 agent 已装 toolchain，可改为:
          # name: MySelfHostedPool
        steps:
          - checkout: self
            persistCredentials: true
          - script: |
              if [ -n "$(VERSION)" ]; then
                NEW_VERSION="$(echo $(VERSION) | sed 's/^v//')"
              else
                NEW_VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/' | sed 's/^v//')
              fi
              echo "##vso[task.setvariable variable=NEW_VERSION]$NEW_VERSION"
            displayName: Set NEW_VERSION
          - script: |
              if [ -n "$(VERSION)" ]; then
                sed -i 's/^version = .*/version = "'"$(NEW_VERSION)"'"/' rust/tgbot/Cargo.toml
                git config user.email "ci@azure.com"
                git config user.name "Azure Pipelines"
                git add rust/tgbot/Cargo.toml
                git commit -m "chore: bump version to $(NEW_VERSION) [skip ci]" || true
                git push origin HEAD:main
              fi
              git tag -f "v$(NEW_VERSION)"
              git push origin "v$(NEW_VERSION)" --force
            displayName: Sync version and tag
            env:
              SOURCE_REPO_TOKEN: $(SOURCE_REPO_TOKEN)
          - script: |
              cd rust/tgbot
              RUSTFLAGS="--remap-path-prefix $(Build.SourcesDirectory)=/project" cargo build --release --locked
              upx --best --lzma target/release/tgbot || true
            displayName: Build tgbot (no network)
          - script: |
              cd go/installer
              CGO_ENABLED=0 GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .
            displayName: Build installer (no network)
          - script: |
              mkdir -p dist
              cp rust/tgbot/target/release/tgbot go/installer/installer dist/
              cp README.public.md dist/README.md
            displayName: Prepare dist
          - script: |
              set +x
              if echo "$(PUBLIC_SERVER)" | grep -q github; then GIT_HOST="github.com"; else GIT_HOST=$(echo "$(PUBLIC_SERVER)" | sed 's|https://||' | sed 's|/.*||'); fi
              git clone --depth 0 "https://$(PUBLIC_REPO_TOKEN)@${GIT_HOST}/$(PUBLIC_OWNER)/$(PUBLIC_REPO).git" public-repo
              set -x
            displayName: Clone public repo
            env:
              PUBLIC_REPO_TOKEN: $(PUBLIC_REPO_TOKEN)
          - script: |
              cd public-repo
              git config user.email "ci@azure.com"
              git config user.name "Azure Pipelines"
              rm -rf *
              cp -r ../dist/* .
              git add .
              git commit -m "Publish v$(NEW_VERSION)" || true
              git tag -f "v$(NEW_VERSION)"
              if echo "$(PUBLIC_SERVER)" | grep -q github; then GIT_HOST="github.com"; else GIT_HOST=$(echo "$(PUBLIC_SERVER)" | sed 's|https://||' | sed 's|/.*||'); fi
              git push "https://$(PUBLIC_REPO_TOKEN)@${GIT_HOST}/$(PUBLIC_OWNER)/$(PUBLIC_REPO).git" HEAD:main --force
              git push "https://$(PUBLIC_REPO_TOKEN)@${GIT_HOST}/$(PUBLIC_OWNER)/$(PUBLIC_REPO).git" "v$(NEW_VERSION)" --force
            displayName: Push to public repo
            env:
              PUBLIC_REPO_TOKEN: $(PUBLIC_REPO_TOKEN)
          - script: |
              BASE="$(PUBLIC_SERVER)"
              AUTH="Authorization: token $(PUBLIC_REPO_TOKEN)"
              API="${BASE}/repos/$(PUBLIC_OWNER)/$(PUBLIC_REPO)"
              if [ "${BASE#*github}" != "$BASE" ]; then
                for tag in $(curl -sS -H "$AUTH" "${API}/releases?per_page=100" | jq -r '.[].tag_name // empty'); do
                  curl -sS -X DELETE -H "$AUTH" "${API}/releases/tags/${tag}" || true
                done
                for tag in $(curl -sS -H "$AUTH" "${API}/tags?per_page=100" | jq -r '.[].name // empty'); do
                  curl -sS -X DELETE -H "$AUTH" "${API}/git/refs/tags/${tag}" || true
                done
                BODY="Public distribution package v$(NEW_VERSION)."
                JSON=$(jq -n --arg tag "v$(NEW_VERSION)" --arg name "v$(NEW_VERSION)" --arg body "$BODY" '{tag_name:$tag,name:$name,body:$body}')
                RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases")
                RID=$(echo "$RES" | jq -r '.id // empty')
                for f in dist/tgbot dist/installer; do
                  [ -f "$f" ] && curl -sS -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@${f}" "${API}/releases/${RID}/assets?name=$(basename $f)"
                done
              fi
            displayName: Cleanup and create release
            env:
              PUBLIC_REPO_TOKEN: $(PUBLIC_REPO_TOKEN)
