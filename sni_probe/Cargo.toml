[package]
name = "sni_probe"
version = "0.1.0"
edition = "2024"
description = "High-performance three-phase SNI probe engine (Rust port of sni_tester hot paths)"

[[bin]]
name = "sni_probe"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
boring = { version = "5.3", features = ["pq-experimental"] }
hickory-resolver = "0.26"
maxminddb = "0.32"
serde = { version = "1", features = ["derive"] }
prost = "0.14"
tokio-socks = "0.5"
ipnet = "2"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1
