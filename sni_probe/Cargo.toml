[package]
name = "sni_probe"
version = "0.1.0"
edition = "2024"
description = "High-performance three-phase SNI probe engine (Rust port of sni_tester hot paths)"

[[bin]]
name = "sni_probe"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
boring = { version = "5.3", features = ["pq-experimental"] }
hickory-resolver = "0.26.3"
maxminddb = "0.32"
serde = { version = "1.0.229", features = ["derive"] }
prost = "0.14.4"
tokio-socks = "0.5.3"
ipnet = "2.12.2"
redb = "2.6.4"
# Windows 侧按 IP 绑定出站用（std 无 bind+connect_timeout 组合）
socket2 = "0.6.5"
serde_json = "1.0.154"
indicatif = "0.18.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "socks"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1
