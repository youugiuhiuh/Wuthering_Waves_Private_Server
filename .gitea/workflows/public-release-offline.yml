# Gitea/Forgejo 不联网版：Runner 需使用预装 Rust/Go/UPX/Garble 的镜像，不执行任何外网下载
# 镜像示例：自建 image 或在同一实例内提供带 toolchain 的镜像
# Secrets: SOURCE_REPO_TOKEN, PUBLIC_REPO_TOKEN（推送/Release 仅限同一实例内）

name: Public Distribution Sync (Offline)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.4)"
        required: true
        type: string
  push:
    paths:
      - "rust/tgbot/Cargo.toml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Set API and Public Repo
        run: |
          echo "API_BASE=${GITHUB_SERVER_URL}" >> $GITHUB_ENV
          echo "PUBLIC_OWNER=NicholasDewar" >> $GITHUB_ENV
          echo "PUBLIC_REPO=Wuthering_Waves_Private_Server" >> $GITHUB_ENV

      - name: Checkout Source
        uses: https://github.com/actions/checkout@v4
        with:
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Resolve Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Update Version in Cargo.toml (Manual Only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/^version = .*/version = "'"${{ env.NEW_VERSION }}"'"/' rust/tgbot/Cargo.toml

      - name: Sync Source Tags
        run: |
          git config --local user.email "action@localhost"
          git config --local user.name "Gitea Action"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add rust/tgbot/Cargo.toml
            git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || true
            git push origin main
          fi
          git tag -f "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}" --force

      - name: Build Runtime Binary (no network)
        run: |
          cd rust/tgbot
          RUSTFLAGS="--remap-path-prefix ${GITHUB_WORKSPACE}=/project" cargo build --release --locked
          ls -lh target/release/tgbot
          upx --best --lzma target/release/tgbot || true

      - name: Build Bootstrap Binary (no network)
        run: |
          cd go/installer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .

      - name: Prepare Public Artifacts
        run: |
          mkdir -p dist
          cp rust/tgbot/target/release/tgbot go/installer/installer dist/
          cp README.public.md dist/README.md

      - name: Checkout Distribution Repo
        uses: https://github.com/actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_OWNER }}/${{ env.PUBLIC_REPO }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Publish Repository Snapshot
        run: |
          cd public-repo
          git config --local user.email "action@localhost"
          git config --local user.name "Gitea Action"
          rm -rf *
          cp -r ../dist/* .
          git add .
          git commit -m "Publish v${{ env.NEW_VERSION }}" || true
          git tag -f "v${{ env.NEW_VERSION }}"
          git push origin main --force
          git push origin "v${{ env.NEW_VERSION }}" --force

      - name: Cleanup and Create Release (same instance API)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          BASE: ${{ env.API_BASE }}
          OWNER: ${{ env.PUBLIC_OWNER }}
          REPO: ${{ env.PUBLIC_REPO }}
        run: |
          AUTH="Authorization: token ${TOKEN}"
          API="${BASE}/api/v1/repos/${OWNER}/${REPO}"
          for id in $(curl -sS -H "$AUTH" "${API}/releases?limit=50" | jq -r '.[].id // empty'); do
            curl -sS -X DELETE -H "$AUTH" "${API}/releases/${id}" || true
          done
          for tag in $(curl -sS -H "$AUTH" "${API}/tags?limit=100" | jq -r '.[].name // empty'); do
            curl -sS -X DELETE -H "$AUTH" "${API}/git/refs/tags/${tag}" || true
          done
          BODY="Public distribution package \`v${{ env.NEW_VERSION }}\`."
          JSON=$(jq -n --arg tag "v${{ env.NEW_VERSION }}" --arg name "v${{ env.NEW_VERSION }}" --arg body "$BODY" '{tag_name:$tag,name:$name,body:$body}')
          RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases")
          RID=$(echo "$RES" | jq -r '.id // empty')
          for f in dist/tgbot dist/installer; do
            [ -f "$f" ] && curl -sS -X POST -H "$AUTH" -F "attachment=@${f};filename=$(basename $f)" "${API}/releases/${RID}/assets?name=$(basename $f)" || true
          done
