# 第二版：尽量使用 GitHub Actions（需 Runner 能访问 GitHub）
# 适合：Forgejo/Gitea 配置了可拉取 github.com 的 Runner 时使用
# Secrets: SOURCE_REPO_TOKEN, PUBLIC_REPO_TOKEN

name: Public Distribution Sync (Gitea + GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.4)"
        required: true
        type: string
  push:
    paths:
      - "rust/tgbot/Cargo.toml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout Source
        uses: https://github.com/actions/checkout@v4
        with:
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Resolve Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Update Version in Cargo.toml (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/^version = .*/version = "'"${{ env.NEW_VERSION }}"'"/' rust/tgbot/Cargo.toml

      - name: Sync Source Tags
        run: |
          git config --local user.email "action@localhost"
          git config --local user.name "Gitea Action"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add rust/tgbot/Cargo.toml
            git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || true
            git push origin main
          fi
          git tag -f "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}" --force

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: "rust/tgbot -> target"

      - name: Compress with UPX
        uses: https://github.com/crazy-max/ghaction-upx@v3
        with:
          version: latest
          install-only: true

      - name: Build Runtime Binary
        run: |
          cd rust/tgbot
          RUSTFLAGS="--remap-path-prefix ${{ github.workspace }}=/project" \
            cargo build --release --locked
          ls -lh target/release/tgbot
          upx --best --lzma target/release/tgbot

      - name: Setup Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/installer/go.sum

      - name: Install Garble
        run: go install mvdan.cc/garble@latest

      - name: Build Bootstrap Binary
        run: |
          cd go/installer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 $(go env GOPATH)/bin/garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .

      - name: Prepare Public Artifacts
        run: |
          mkdir -p dist
          cp rust/tgbot/target/release/tgbot dist/
          cp go/installer/installer dist/
          cp README.public.md dist/README.md

      - name: Set API Base
        run: |
          echo "API_BASE=${{ github.server_url }}" >> $GITHUB_ENV
          echo "PUBLIC_OWNER=NicholasDewar" >> $GITHUB_ENV
          echo "PUBLIC_REPO=Wuthering_Waves_Private_Server" >> $GITHUB_ENV

      - name: Checkout Distribution Repo
        uses: https://github.com/actions/checkout@v4
        with:
          repository: NicholasDewar/Wuthering_Waves_Private_Server
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Publish Repository Snapshot
        run: |
          cd public-repo
          git config --local user.email "action@localhost"
          git config --local user.name "Gitea Action"
          rm -rf *
          cp -r ../dist/* .
          git add .
          git commit -m "Publish v${{ env.NEW_VERSION }}" || true
          git tag -f "v${{ env.NEW_VERSION }}"
          git push origin main --force
          git push origin "v${{ env.NEW_VERSION }}" --force

      - name: Cleanup Previous Releases (Gitea/Forgejo API)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          BASE: ${{ env.API_BASE }}
          OWNER: ${{ env.PUBLIC_OWNER }}
          REPO: ${{ env.PUBLIC_REPO }}
        run: |
          AUTH="Authorization: token ${TOKEN}"
          API="${BASE}/api/v1/repos/${OWNER}/${REPO}"
          while true; do
            JSON=$(curl -sS -H "$AUTH" "${API}/releases?limit=50" || echo "[]")
            IDs=$(echo "$JSON" | jq -r '.[].id // empty')
            [ -z "$IDs" ] && break
            for id in $IDs; do
              echo "Deleting release id: $id"
              curl -sS -X DELETE -H "$AUTH" "${API}/releases/${id}" || true
            done
          done
          TAGS=$(curl -sS -H "$AUTH" "${API}/tags?limit=100" | jq -r '.[].name // empty')
          for tag in $TAGS; do
            echo "Deleting tag: $tag"
            curl -sS -X DELETE -H "$AUTH" "${API}/git/refs/tags/${tag}" || true
          done

      - name: Create Public Release (Gitea/Forgejo API)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          BASE: ${{ env.API_BASE }}
          OWNER: ${{ env.PUBLIC_OWNER }}
          REPO: ${{ env.PUBLIC_REPO }}
        run: |
          AUTH="Authorization: token ${TOKEN}"
          API="${BASE}/api/v1/repos/${OWNER}/${REPO}"
          BODY="Public distribution package \`v${{ env.NEW_VERSION }}\`.

          This release is generated from the private source repository and contains the current public runtime artifacts.

          ### Included Files
          - \`installer\`: bootstrap executable
          - \`tgbot\`: runtime management executable"
          JSON=$(jq -n \
            --arg tag "v${{ env.NEW_VERSION }}" \
            --arg name "v${{ env.NEW_VERSION }}" \
            --arg body "$BODY" \
            '{tag_name:$tag,name:$name,body:$body}')
          RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases")
          RID=$(echo "$RES" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            echo "Create release failed: $RES"
            exit 1
          fi
          for f in dist/tgbot dist/installer; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name..."
            curl -sS -X POST -H "$AUTH" \
              -F "attachment=@${f};filename=${name}" \
              "${API}/releases/${RID}/assets?name=${name}" || true
          done
          echo "Release v${{ env.NEW_VERSION }} created (id=$RID)."
