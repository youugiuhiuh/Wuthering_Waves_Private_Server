# Gitea/Forgejo 版：与 .github/workflows/public-release.yml 功能一致
# 使用方式：放入 .gitea/workflows/ 或（若实例支持）复制到 .github/workflows/
# 需在仓库/组织配置 Secrets: SOURCE_REPO_TOKEN, PUBLIC_REPO_TOKEN
# 可选 Secret: PUBLIC_SERVER_URL（公开仓库在另一台 Gitea/Forgejo 时填写，如 https://codeberg.org）
# 可选 Var: PUBLIC_REPO_OWNER, PUBLIC_REPO_NAME（默认 youugiuhiuh, Wuthering_Waves_Private_Server）

name: Public Distribution Sync (Gitea/Forgejo)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.4)"
        required: true
        type: string
  push:
    paths:
      - "rust/tgbot/Cargo.toml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Set API and Public Repo
        run: |
          echo "API_BASE=${GITHUB_SERVER_URL}" >> $GITHUB_ENV
          echo "PUBLIC_OWNER=youugiuhiuh" >> $GITHUB_ENV
          echo "PUBLIC_REPO=Wuthering_Waves_Private_Server" >> $GITHUB_ENV
          # 若公开仓在另一实例，在 Secrets 中设 PUBLIC_SERVER_URL 后取消下一行注释并重跑
          # [ -n "${{ secrets.PUBLIC_SERVER_URL }}" ] && echo "API_BASE=${{ secrets.PUBLIC_SERVER_URL }}" >> $GITHUB_ENV

      - name: Checkout Source
        run: |
          git clone --depth 0 "https://${{ secrets.SOURCE_REPO_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
          git fetch --tags || true

      - name: Resolve Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Update Version in Cargo.toml (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/^version = .*/version = "'"${{ env.NEW_VERSION }}"'"/' rust/tgbot/Cargo.toml

      - name: Sync Source Tags
        run: |
          git config --local user.email "action@localhost"
          git config --local user.name "Gitea Action"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add rust/tgbot/Cargo.toml
            git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" || true
            git push "https://${{ secrets.SOURCE_REPO_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" main
          fi
          git tag -f "v${{ env.NEW_VERSION }}"
          git push "https://${{ secrets.SOURCE_REPO_TOKEN }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" "v${{ env.NEW_VERSION }}" --force

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version

      - name: Install UPX
        run: |
          sudo apt-get update -qq && sudo apt-get install -y upx-ucl
          upx --version

      - name: Build Runtime Binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd rust/tgbot
          RUSTFLAGS="--remap-path-prefix ${GITHUB_WORKSPACE}=/project" \
            cargo build --release --locked
          ls -lh target/release/tgbot
          upx --best --lzma target/release/tgbot || true

      - name: Setup Go
        run: |
          curl -sL "https://go.dev/dl/go1.22.4.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
          echo "GOROOT=/usr/local/go" >> $GITHUB_ENV
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version

      - name: Install Garble
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          go install mvdan.cc/garble@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build Bootstrap Binary
        run: |
          export PATH="/usr/local/go/bin:$(go env GOPATH)/bin:$PATH"
          cd go/installer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .

      - name: Prepare Public Artifacts
        run: |
          mkdir -p dist
          cp rust/tgbot/target/release/tgbot dist/
          cp go/installer/installer dist/
          cp README.public.md dist/README.md

      - name: Checkout Distribution Repo
        run: |
          SERVER="${API_BASE#https://}"
          git clone --depth 0 "https://${{ secrets.PUBLIC_REPO_TOKEN }}@${SERVER}/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" public-repo

      - name: Publish Repository Snapshot
        run: |
          cd public-repo
          git config --local user.email "action@localhost"
          git config --local user.name "Gitea Action"
          rm -rf *
          cp -r ../dist/* .
          git add .
          git commit -m "Publish v${{ env.NEW_VERSION }}" || true
          git tag -f "v${{ env.NEW_VERSION }}"
          SERVER="${API_BASE#https://}"
          git push "https://${{ secrets.PUBLIC_REPO_TOKEN }}@${SERVER}/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" main --force
          git push "https://${{ secrets.PUBLIC_REPO_TOKEN }}@${SERVER}/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" "v${{ env.NEW_VERSION }}" --force

      - name: Cleanup Previous Releases (Gitea/Forgejo API)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          BASE: ${{ env.API_BASE }}
          OWNER: ${{ env.PUBLIC_OWNER }}
          REPO: ${{ env.PUBLIC_REPO }}
        run: |
          AUTH="Authorization: token ${TOKEN}"
          API="${BASE}/api/v1/repos/${OWNER}/${REPO}"
          # 删除所有 Release（会同时清理其 tag，视实现而定）
          while true; do
            JSON=$(curl -sS -H "$AUTH" "${API}/releases?limit=50" || echo "[]")
            IDs=$(echo "$JSON" | jq -r '.[].id // empty')
            [ -z "$IDs" ] && break
            for id in $IDs; do
              echo "Deleting release id: $id"
              curl -sS -X DELETE -H "$AUTH" "${API}/releases/${id}" || true
            done
          done
          # 删除可能残留的 tag（Gitea: refs/tags/xxx）
          TAGS=$(curl -sS -H "$AUTH" "${API}/tags?limit=100" | jq -r '.[].name // empty')
          for tag in $TAGS; do
            echo "Deleting tag: $tag"
            curl -sS -X DELETE -H "$AUTH" "${API}/git/refs/tags/${tag}" || true
          done

      - name: Create Public Release (Gitea/Forgejo API)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          BASE: ${{ env.API_BASE }}
          OWNER: ${{ env.PUBLIC_OWNER }}
          REPO: ${{ env.PUBLIC_REPO }}
        run: |
          AUTH="Authorization: token ${TOKEN}"
          API="${BASE}/api/v1/repos/${OWNER}/${REPO}"
          BODY="Public distribution package \`v${{ env.NEW_VERSION }}\`.

          This release is generated from the private source repository and contains the current public runtime artifacts.

          ### Included Files
          - \`installer\`: bootstrap executable
          - \`tgbot\`: runtime management executable"
          JSON=$(jq -n \
            --arg tag "v${{ env.NEW_VERSION }}" \
            --arg name "v${{ env.NEW_VERSION }}" \
            --arg body "$BODY" \
            '{tag_name:$tag,name:$name,body:$body}')
          RES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases")
          RID=$(echo "$RES" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            echo "Create release failed: $RES"
            exit 1
          fi
          # 上传附件
          for f in dist/tgbot dist/installer; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name..."
            curl -sS -X POST -H "$AUTH" \
              -F "attachment=@${f};filename=${name}" \
              "${API}/releases/${RID}/assets?name=${name}" || true
          done
          echo "Release v${{ env.NEW_VERSION }} created (id=$RID)."
