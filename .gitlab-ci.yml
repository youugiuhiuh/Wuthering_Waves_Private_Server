# GitLab CI：与 GitHub Actions public-release 等效
# 变量/Secrets: SOURCE_REPO_TOKEN, PUBLIC_REPO_TOKEN, 可选 PUBLIC_REPO_OWNER, PUBLIC_REPO_NAME

variables:
  PUBLIC_OWNER: ${PUBLIC_REPO_OWNER:-youugiuhiuh}
  PUBLIC_REPO: ${PUBLIC_REPO_NAME:-Wuthering_Waves_Private_Server}

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $VERSION
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - rust/tgbot/Cargo.toml

stages:
  - build
  - release

.resolve_version:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -n "$VERSION" ]; then
        NEW_VERSION="${VERSION#v}"
      else
        NEW_VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/' | sed 's/^v//')
      fi
      echo "NEW_VERSION=$NEW_VERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env

build:
  stage: build
  image: ubuntu:22.04
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $VERSION
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - rust/tgbot/Cargo.toml
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git ca-certificates upx-ucl jq
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$HOME/.cargo/bin:$PATH"
    - curl -sL "https://go.dev/dl/go1.22.4.linux-amd64.tar.gz" | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH"
    - go install mvdan.cc/garble@latest
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - source build.env 2>/dev/null || true
    - |
      if [ -z "$NEW_VERSION" ]; then
        if [ -n "$VERSION" ]; then NEW_VERSION="${VERSION#v}"; else
          NEW_VERSION=$(grep -m1 '^version' rust/tgbot/Cargo.toml | sed 's/.*"\(.*\)"/\1/' | sed 's/^v//'); fi
      fi
      echo "NEW_VERSION=$NEW_VERSION" >> build.env
    - |
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ -n "$VERSION" ]; then
        sed -i 's/^version = .*/version = "'"$NEW_VERSION"'"/' rust/tgbot/Cargo.toml
        git add rust/tgbot/Cargo.toml
        git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || true
        git push "https://${SOURCE_REPO_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}
      fi
    - git tag -f "v${NEW_VERSION}"
    - git push "https://${SOURCE_REPO_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "v${NEW_VERSION}" --force
    - cd rust/tgbot && RUSTFLAGS="--remap-path-prefix $(pwd)=/project" cargo build --release --locked
    - ls -la rust/tgbot/target/release/tgbot
    - upx --best --lzma rust/tgbot/target/release/tgbot || true
    - cd go/installer && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 garble -literals -tiny -seed=random build -ldflags="-s -w" -o installer .
    - mkdir -p dist && cp rust/tgbot/target/release/tgbot go/installer/installer dist/
    - cp README.public.md dist/README.md
  artifacts:
    paths:
      - dist/
      - build.env

release:
  stage: release
  image: alpine:latest
  needs: [build]
  before_script:
    - apk add --no-cache git curl jq
    - source build.env
  script:
    - |
      set +x
      git clone --depth 0 "https://${PUBLIC_REPO_TOKEN}@${CI_SERVER_HOST}/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" public-repo
      set -x
    - cd public-repo && git config user.email "ci@gitlab.com" && git config user.name "GitLab CI"
    - rm -rf public-repo/* && cp -r dist/* public-repo/
    - cd public-repo && git add . && git commit -m "Publish v${NEW_VERSION}" || true
    - cd public-repo && git tag -f "v${NEW_VERSION}"
    - cd public-repo && git push "https://${PUBLIC_REPO_TOKEN}@${CI_SERVER_HOST}/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" HEAD:${CI_DEFAULT_BRANCH} --force
    - cd public-repo && git push "https://${PUBLIC_REPO_TOKEN}@${CI_SERVER_HOST}/${PUBLIC_OWNER}/${PUBLIC_REPO}.git" "v${NEW_VERSION}" --force
    - |
      PROJ="${PUBLIC_OWNER}%2F${PUBLIC_REPO}"
      API="${CI_SERVER_URL}/api/v4/projects/${PROJ}"
      AUTH="PRIVATE-TOKEN: ${PUBLIC_REPO_TOKEN}"
      for tag in $(curl -sS -H "$AUTH" "${API}/releases?per_page=100" | jq -r '.[].tag_name // empty'); do
        echo "Deleting release: $tag"
        curl -sS -X DELETE -H "$AUTH" "${API}/releases/${tag}" || true
      done
    - |
      PROJ="${PUBLIC_OWNER}%2F${PUBLIC_REPO}"
      API="${CI_SERVER_URL}/api/v4/projects/${PROJ}"
      AUTH="PRIVATE-TOKEN: ${PUBLIC_REPO_TOKEN}"
      JSON=$(jq -n --arg tag "v${NEW_VERSION}" --arg name "v${NEW_VERSION}" --arg body "Public distribution package v${NEW_VERSION}." \
        '{tag_name:$tag,name:$name,description:$body}')
      curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d "$JSON" "${API}/releases"
      RAW="${CI_SERVER_URL}/${PUBLIC_OWNER}/${PUBLIC_REPO}/-/raw/main"
      for f in tgbot installer; do
        curl -sS -X POST -H "$AUTH" -d "name=${f}&url=${RAW}/${f}&link_type=other" \
          "${API}/releases/v${NEW_VERSION}/assets/links"
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $VERSION
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - rust/tgbot/Cargo.toml
